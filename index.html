<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxIndex</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Georgia:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .serif-font {
            font-family: 'Georgia', serif;
        }
        .card-bg {
            background-color: #181818;
        }
        .active-card {
            background-color: #242424;
            border-left: 3px solid #3b82f6;
        }

        @keyframes flicker {
            0%, 100% { transform: scale(1) rotate(-2deg); opacity: 0.92; }
            50% { transform: scale(1.18) rotate(2deg); opacity: 1; }
        }
        @keyframes purplePulse {
            0%, 100% { filter: hue-rotate(265deg) saturate(2.2) drop-shadow(0 0 14px #a855f7); transform: scale(1.08) rotate(-3deg); }
            50% { filter: hue-rotate(280deg) saturate(2.6) drop-shadow(0 0 24px #c084fc); transform: scale(1.26) rotate(3deg); }
        }
        @keyframes drip {
            0% { transform: translateY(-3px); opacity: 0.8; filter: drop-shadow(0 0 6px #dc2626); }
            50% { transform: translateY(4px); opacity: 1; filter: drop-shadow(0 0 10px #991b1b); }
            100% { transform: translateY(-3px); opacity: 0.8; filter: drop-shadow(0 0 6px #dc2626); }
        }
        @keyframes goldShine {
            0%, 100% { box-shadow: 0 0 8px rgba(250, 204, 21, 0.5); }
            50% { box-shadow: 0 0 16px rgba(250, 204, 21, 0.9); }
        }

        .fire-badge {
            display: inline-block;
            animation: flicker 1.3s infinite ease-in-out;
        }
        .blood-badge {
            display: inline-block;
            animation: drip 1.2s infinite ease-in-out;
        }
        .trillionaire-badge {
            background: linear-gradient(90deg, #f59e0b, #fde047, #d97706);
            color: #000000;
            font-weight: 800;
            letter-spacing: 0.05em;
            animation: goldShine 2s infinite ease-in-out;
        }

        .fire-tier-1 { filter: drop-shadow(0 0 7px #fb923c) brightness(1.1); }
        .glow-tier-1 { box-shadow: 0 0 14px rgba(251, 146, 60, 0.28); border: 1px solid rgba(251, 146, 60, 0.45); }
        .fire-tier-5 { filter: saturate(1.6) drop-shadow(0 0 11px #f97316); }
        .glow-tier-5 { box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); border: 1px solid rgba(249, 115, 22, 0.65); }
        .fire-tier-10 { filter: hue-rotate(28deg) brightness(1.35) drop-shadow(0 0 13px #facc15); }
        .glow-tier-10 { box-shadow: 0 0 22px rgba(250, 204, 21, 0.45); border: 1px solid rgba(250, 204, 21, 0.75); }
        .fire-tier-15 { filter: hue-rotate(-25deg) saturate(2) drop-shadow(0 0 14px #ef4444); }
        .glow-tier-15 { box-shadow: 0 0 25px rgba(239, 68, 68, 0.5); border: 1px solid rgba(239, 68, 68, 0.8); }
        .fire-tier-20 { filter: hue-rotate(95deg) saturate(1.8) drop-shadow(0 0 14px #22c55e); }
        .glow-tier-20 { box-shadow: 0 0 25px rgba(34, 197, 94, 0.5); border: 1px solid rgba(34, 197, 94, 0.8); }
        .fire-tier-30 { filter: hue-rotate(195deg) saturate(2) drop-shadow(0 0 16px #3b82f6); }
        .glow-tier-30 { box-shadow: 0 0 28px rgba(59, 130, 246, 0.55); border: 1px solid rgba(59, 130, 246, 0.85); }
        .fire-tier-40 { animation: purplePulse 1.5s infinite ease-in-out; }
        .glow-tier-40 { box-shadow: 0 0 32px rgba(168, 85, 247, 0.65), inset 0 0 16px rgba(168, 85, 247, 0.25); border: 1px solid #a855f7; }

        .blood-glow {
            box-shadow: 0 0 22px rgba(220, 38, 38, 0.4);
            border: 1px solid rgba(220, 38, 38, 0.7);
        }
    </style>
</head>
<body x-data="empireApp()" x-init="initEmpire()" class="min-h-screen px-4 sm:px-6 py-4 flex flex-col">

    <!-- Notificación Toast Flotante -->
    <div x-show="toastMessage" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-4"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         class="fixed bottom-6 right-6 z-50 max-w-sm bg-neutral-900 border border-neutral-700 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3"
         style="display: none;">
        <span class="text-lg" x-text="toastIcon"></span>
        <span class="text-xs font-medium" x-text="toastMessage"></span>
        <button @click="toastMessage = ''" class="text-neutral-400 hover:text-white ml-2 text-base">×</button>
    </div>

    <!-- Título Principal -->
    <div class="max-w-7xl mx-auto w-full pt-4 pb-2 text-center">
        <h1 class="serif-font text-4xl md:text-5xl font-bold tracking-tight uppercase">
            <span class="fire-badge fire-tier-5 mr-2">🔥</span><span x-text="t('title')"></span><span class="fire-badge fire-tier-5 ml-2">🔥</span>
        </h1>
        
        <div class="mt-3 inline-flex items-center gap-2.5 bg-[#141414] border border-neutral-800 px-4 py-1.5 rounded-full text-xs text-neutral-300 shadow-lg">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <span x-text="t('nextUpdateLabel')"></span>
            <span class="font-mono font-bold text-white tracking-wider" x-text="formattedCountdown"></span>
        </div>
    </div>

    <!-- Barra Superior de Navegación -->
    <header class="flex flex-col md:flex-row items-center justify-between text-sm font-medium border-b border-neutral-800 pb-3 mb-8 max-w-7xl mx-auto w-full gap-4 mt-4">
        <div class="flex items-center space-x-6 flex-wrap">
            <button @click="resetViews('top5')" :class="currentFilter === 'top5' && !selectedPerson && !selectedCompany && !showFriendsView ? 'text-white border-b-2 border-white pb-1' : 'text-neutral-400 hover:text-white'" x-text="t('top5')"></button>
            <button @click="resetViews('all')" :class="currentFilter === 'all' && !selectedCategory && !selectedPerson && !selectedCompany && !showFriendsView ? 'text-white border-b-2 border-white pb-1' : 'text-neutral-400 hover:text-white'" x-text="t('top')"></button>
            <button @click="resetViews('women')" :class="currentFilter === 'women' && !selectedPerson && !selectedCompany && !showFriendsView ? 'text-white border-b-2 border-white pb-1' : 'text-neutral-400 hover:text-white'" x-text="t('women')"></button>
            <button @click="resetViews('companies')" :class="currentFilter === 'companies' && !selectedPerson && !selectedCompany && !showFriendsView ? 'text-white border-b-2 border-white pb-1' : 'text-neutral-400 hover:text-white'" x-text="t('companiesTab')"></button>
            
            <template x-if="currentUser">
                <button @click="showFriendsView = true; selectedPerson = null; selectedCompany = null;" :class="showFriendsView ? 'text-white border-b-2 border-white pb-1' : 'text-neutral-400 hover:text-white'" class="flex items-center gap-1.5">
                    <span>👥</span> <span x-text="t('friendsTab')"></span>
                    <span x-show="userFriends.length > 0" class="bg-blue-600 text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold" x-text="userFriends.length"></span>
                </button>
            </template>
            
            <div class="relative" @click.away="showCategoriesDropdown = false">
                <button @click="showCategoriesDropdown = !showCategoriesDropdown; currentFilter = 'categories'; selectedPerson = null; selectedCompany = null; showFriendsView = false;" :class="selectedCategory || showCategoriesDropdown ? 'text-white border-b-2 border-white pb-1' : 'text-neutral-400 hover:text-white'" class="flex items-center gap-1">
                    <span x-text="t('categories')"></span> <span class="text-xs">▾</span>
                </button>

                <div x-show="showCategoriesDropdown" class="absolute left-0 mt-2 w-64 card-bg border border-neutral-800 rounded-xl shadow-2xl py-2 z-50" style="display: none;">
                    <template x-for="cat in uniqueCategories" :key="cat">
                        <button @click="selectedCategory = cat; showCategoriesDropdown = false; currentFilter = 'categories'; showFriendsView = false;" class="w-full text-left px-4 py-2.5 text-sm hover:bg-neutral-800 text-neutral-300 hover:text-white transition flex items-center justify-between">
                            <span x-text="cat"></span>
                            <span class="text-xs text-neutral-500" x-text="people.filter(p => p.source === cat).length"></span>
                        </button>
                    </template>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-3 w-full md:w-auto justify-end flex-wrap">
            <div class="relative">
                <select x-model="lang" @change="changeLanguage(lang)" class="bg-[#181818] border border-neutral-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-neutral-600 cursor-pointer">
                    <option value="es">🇪🇸 Español</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="it">🇮🇹 Italiano</option>
                    <option value="pt">🇵🇹 Português</option>
                    <option value="de">🇩🇪 Deutsch</option>
                </select>
            </div>

            <div class="relative w-full md:w-48">
                <input type="text" x-model="searchQuery" :placeholder="t('searchPlaceholder')" class="w-full bg-[#181818] border border-neutral-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-neutral-600">
            </div>

            <!-- Botón de Notificaciones de Invitaciones -->
            <template x-if="currentUser && pendingInvitesForCurrentUser.length > 0">
                <button @click="showInvitesModal = true" class="relative bg-amber-500/20 border border-amber-500/50 hover:bg-amber-500/30 text-amber-300 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 animate-pulse">
                    <span>🔔</span>
                    <span x-text="pendingInvitesForCurrentUser.length"></span>
                </button>
            </template>

            <template x-if="!currentUser">
                <button @click="showRegisterModal = true" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-lg text-xs font-semibold transition whitespace-nowrap" x-text="t('registerLogin')"></button>
            </template>

            <template x-if="currentUser">
                <div class="relative" @click.away="showUserMenu = false">
                    <div @click="showUserMenu = !showUserMenu" class="flex items-center gap-2 bg-neutral-900 border border-neutral-800 px-3 py-1.5 rounded-lg cursor-pointer hover:bg-neutral-800 transition">
                        <img :src="currentUser.img" class="w-6 h-6 rounded-full object-cover bg-black" alt="Avatar">
                        <span class="text-xs font-medium text-white" x-text="currentUser.name"></span>
                        <span class="text-xs text-neutral-400">▾</span>
                    </div>

                    <div x-show="showUserMenu" class="absolute right-0 mt-2 w-60 card-bg border border-neutral-800 rounded-xl shadow-2xl py-2 z-50" style="display: none;">
                        <button @click="openProfile(currentUser); showUserMenu = false" class="w-full text-left px-4 py-2 text-xs hover:bg-neutral-800 text-neutral-300 hover:text-white transition flex items-center gap-2">
                            👤 <span x-text="t('myProfile')"></span>
                        </button>
                        <button @click="openBioEditor(currentUser); showUserMenu = false" class="w-full text-left px-4 py-2 text-xs hover:bg-neutral-800 text-neutral-300 hover:text-white transition flex items-center gap-2">
                            ✏️ <span x-text="t('editBio')"></span>
                        </button>
                        <button @click="openCompanyModal(false); showUserMenu = false" class="w-full text-left px-4 py-2 text-xs hover:bg-neutral-800 text-blue-400 hover:text-blue-300 transition flex items-center gap-2 font-semibold">
                            🏢 <span x-text="t('createAnotherCompany')"></span>
                        </button>
                        <button @click="showFriendsView = true; selectedPerson = null; selectedCompany = null; showUserMenu = false" class="w-full text-left px-4 py-2 text-xs hover:bg-neutral-800 text-purple-400 transition flex items-center justify-between">
                            <span class="flex items-center gap-2">👥 <span x-text="t('friendsTab')"></span></span>
                            <span class="bg-neutral-800 text-white px-1.5 py-0.5 rounded text-[10px]" x-text="userFriends.length"></span>
                        </button>
                        <template x-if="userOwnedCompanies.length > 0">
                            <div class="border-t border-neutral-800 my-1 pt-1">
                                <div class="px-4 py-1 text-[10px] text-neutral-500 uppercase font-bold" x-text="t('myCompaniesLabel')"></div>
                                <template x-for="comp in userOwnedCompanies" :key="comp.name">
                                    <button @click="openCompanyDashboard(comp); showUserMenu = false" class="w-full text-left px-4 py-1.5 text-xs hover:bg-neutral-800 text-emerald-400 hover:text-emerald-300 transition flex items-center justify-between">
                                        <span class="truncate" x-text="comp.name"></span>
                                        <span class="text-[10px] text-neutral-500" x-text="'LVL ' + (comp.level || 1)"></span>
                                    </button>
                                </template>
                            </div>
                        </template>
                        <template x-if="pendingInvitesForCurrentUser.length > 0">
                            <button @click="showInvitesModal = true; showUserMenu = false" class="w-full text-left px-4 py-2 text-xs hover:bg-neutral-800 text-amber-400 transition flex items-center justify-between">
                                <span class="flex items-center gap-2">🔔 <span x-text="t('invitesMenu')"></span></span>
                                <span class="bg-amber-500 text-black font-bold px-1.5 py-0.5 rounded-full text-[10px]" x-text="pendingInvitesForCurrentUser.length"></span>
                            </button>
                        </template>
                        <div class="border-t border-neutral-800 my-1"></div>
                        <button @click="logoutUser(); showUserMenu = false" class="w-full text-left px-4 py-2 text-xs hover:bg-neutral-800 text-red-400 transition flex items-center gap-2">
                            🚪 <span x-text="t('logout')"></span>
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </header>

    <!-- Vista de Amigos -->
    <main x-show="showFriendsView" class="flex-grow max-w-5xl mx-auto w-full" style="display: none;">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="serif-font text-3xl font-bold" x-text="t('friendsTitle')"></h1>
                <p class="text-xs text-neutral-400 mt-1" x-text="t('friendsDesc')"></p>
            </div>
            <button @click="showFriendsView = false" class="text-sm bg-neutral-800 hover:bg-neutral-700 text-white px-4 py-2 rounded-lg transition self-start" x-text="t('backButton')"></button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <!-- Buscar y Añadir Amigos -->
            <div class="card-bg border border-neutral-800 p-6 rounded-2xl md:col-span-1 shadow-lg">
                <h3 class="serif-font text-lg font-bold text-white mb-1" x-text="t('addFriendTitle')"></h3>
                <p class="text-xs text-neutral-400 mb-4" x-text="t('addFriendDesc')"></p>
                
                <div class="space-y-3">
                    <input type="text" x-model="friendSearchInput" :placeholder="t('friendSearchPlaceholder')" class="w-full bg-black border border-neutral-700 rounded-lg px-3.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                    
                    <div class="max-h-48 overflow-y-auto space-y-2 mt-2">
                        <template x-for="candidate in availableUsersToFriend" :key="candidate.name">
                            <div class="bg-black/50 border border-neutral-800 p-2.5 rounded-xl flex items-center justify-between">
                                <div class="flex items-center gap-2.5">
                                    <img :src="candidate.img" class="w-8 h-8 rounded-lg object-cover bg-black">
                                    <div class="text-xs font-semibold text-white truncate max-w-[100px]" x-text="candidate.name"></div>
                                </div>
                                <button @click="sendFriendRequest(candidate.name)" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1 rounded-lg text-[11px] font-semibold transition" x-text="t('addBtn')"></button>
                            </div>
                        </template>
                    </div>
                </div>

                <template x-if="incomingFriendRequests.length > 0">
                    <div class="mt-6 pt-4 border-t border-neutral-800">
                        <h4 class="text-xs font-bold text-amber-400 uppercase mb-3" x-text="t('pendingRequestsTitle')"></h4>
                        <div class="space-y-2">
                            <template x-for="reqName in incomingFriendRequests" :key="reqName">
                                <div class="bg-amber-500/10 border border-amber-500/30 p-2.5 rounded-xl flex items-center justify-between">
                                    <div class="flex items-center gap-2">
                                        <img :src="getUserAvatarByName(reqName)" class="w-7 h-7 rounded-full object-cover">
                                        <span class="text-xs font-bold text-white" x-text="reqName"></span>
                                    </div>
                                    <div class="flex gap-1">
                                        <button @click="acceptFriendRequest(reqName)" class="bg-green-600 hover:bg-green-500 text-white px-2.5 py-1 rounded text-[10px] font-semibold">✓</button>
                                        <button @click="rejectFriendRequest(reqName)" class="bg-neutral-800 hover:bg-neutral-700 text-neutral-300 px-2.5 py-1 rounded text-[10px]">✕</button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Lista de Amigos -->
            <div class="card-bg border border-neutral-800 p-6 rounded-2xl md:col-span-2 shadow-lg">
                <h3 class="serif-font text-lg font-bold text-white mb-4" x-text="t('myFriendsListTitle') + ' (' + userFriends.length + ')'"></h3>
                
                <div x-show="userFriends.length === 0" class="text-center py-12 text-neutral-500 text-xs">
                    <div class="text-3xl mb-2">🤝</div>
                    <span x-text="t('noFriendsYet')"></span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <template x-for="friendName in userFriends" :key="friendName">
                        <div class="bg-black/40 border border-neutral-800 p-3.5 rounded-xl flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <img :src="getUserAvatarByName(friendName)" class="w-10 h-10 rounded-xl object-cover bg-black">
                                <div>
                                    <div class="text-sm font-bold text-white" x-text="friendName"></div>
                                    <div class="text-[11px] text-green-400 font-medium" x-text="t('onlineStatus')"></div>
                                </div>
                            </div>
                            <button @click="removeFriend(friendName)" class="text-xs text-neutral-500 hover:text-red-400 p-1">✕</button>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </main>

    <!-- Contenido Principal (Rankings) -->
    <main x-show="!selectedPerson && !selectedCompany && !showFriendsView" class="flex-grow max-w-7xl mx-auto w-full">

        <!-- Top 5 Ganadores y Perdedores -->
        <div x-show="searchQuery === '' && !selectedCategory && currentFilter !== 'companies'" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
            <div class="card-bg border border-green-900/40 rounded-2xl p-5 shadow-lg">
                <div class="flex items-center justify-between mb-4 border-b border-neutral-800 pb-2.5">
                    <h2 class="serif-font text-lg font-bold text-green-400 flex items-center gap-2">
                        <span>🔥</span> <span x-text="t('topGainersTitle')"></span>
                    </h2>
                    <span class="text-[11px] text-neutral-400 uppercase tracking-wider" x-text="t('lastCycleTag')"></span>
                </div>
                <div class="space-y-2.5">
                    <template x-for="(gainer, idx) in top5Gainers" :key="'g-' + gainer.id">
                        <div @click="openProfile(gainer)" class="flex items-center justify-between bg-black/40 hover:bg-neutral-800/80 p-2.5 rounded-xl cursor-pointer transition border border-neutral-800/60">
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-bold text-green-400 w-4" x-text="'#' + (idx + 1)"></span>
                                <img :src="gainer.img" class="w-9 h-9 rounded-lg object-cover bg-black" alt="Avatar">
                                <div>
                                    <div class="text-sm font-semibold text-white flex items-center gap-1.5 flex-wrap">
                                        <span x-text="gainer.name"></span>
                                        <template x-if="isTrillionaire(gainer)">
                                            <span class="trillionaire-badge text-[9px] px-1.5 py-0.5 rounded uppercase" x-text="getTrillionaireLabel(gainer)"></span>
                                        </template>
                                        <template x-if="hasFire(gainer)">
                                            <span :class="getFireBadgeClass(gainer)" class="fire-badge text-xs" :title="getFireLabel(gainer)">🔥</span>
                                        </template>
                                    </div>
                                    <div class="text-[11px] text-neutral-400" x-text="formatWorth(gainer.netWorthValue)"></div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-xs font-bold text-green-400" x-text="formatDailyChange(gainer)"></div>
                                <div class="text-[10px] text-neutral-500" x-text="gainer.source"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div class="card-bg border border-red-900/40 rounded-2xl p-5 shadow-lg">
                <div class="flex items-center justify-between mb-4 border-b border-neutral-800 pb-2.5">
                    <h2 class="serif-font text-lg font-bold text-red-400 flex items-center gap-2">
                        <span>🩸</span> <span x-text="t('topLosersTitle')"></span>
                    </h2>
                    <span class="text-[11px] text-neutral-400 uppercase tracking-wider" x-text="t('lastCycleTag')"></span>
                </div>
                <div class="space-y-2.5">
                    <template x-for="(loser, idx) in top5Losers" :key="'l-' + loser.id">
                        <div @click="openProfile(loser)" class="flex items-center justify-between bg-black/40 hover:bg-neutral-800/80 p-2.5 rounded-xl cursor-pointer transition border border-neutral-800/60">
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-bold text-red-400 w-4" x-text="'#' + (idx + 1)"></span>
                                <img :src="loser.img" class="w-9 h-9 rounded-lg object-cover bg-black" alt="Avatar">
                                <div>
                                    <div class="text-sm font-semibold text-white flex items-center gap-1.5 flex-wrap">
                                        <span x-text="loser.name"></span>
                                        <template x-if="isTrillionaire(loser)">
                                            <span class="trillionaire-badge text-[9px] px-1.5 py-0.5 rounded uppercase" x-text="getTrillionaireLabel(loser)"></span>
                                        </template>
                                        <template x-if="isBloodActive(loser)">
                                            <span class="blood-badge text-xs">🩸</span>
                                        </template>
                                    </div>
                                    <div class="text-[11px] text-neutral-400" x-text="formatWorth(loser.netWorthValue)"></div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-xs font-bold text-red-400" x-text="formatDailyChange(loser)"></div>
                                <div class="text-[10px] text-neutral-500" x-text="loser.source"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
        
        <!-- Vista Top 5 con Gráfica -->

                            <span>✏️</span> <span x-text="t('editCompanyBtn')"></span>
                        </button>
                    </template>
                    <template x-if="isCompanyOwner(selectedCompany)">
                        <button @click="deleteCompany(selectedCompany)" class="bg-red-900/40 hover:bg-red-900/80 border border-red-700/50 text-red-300 px-3 py-2 rounded-xl text-xs font-semibold transition" title="Eliminar empresa">
                            🗑️
                        </button>
                    </template>
                </div>
            </div>

            <!-- Pestañas de la Empresa -->
            <div class="inline-flex bg-[#1c1c1c] p-1 rounded-full mb-7 border border-neutral-800/80 overflow-x-auto max-w-full">
                <button @click="compTab = 'overview'" :class="compTab === 'overview' ? 'bg-[#2c2c2c] text-white font-semibold shadow-sm' : 'text-neutral-400 hover:text-white'" class="px-4 py-1.5 rounded-full text-xs md:text-sm transition whitespace-nowrap" x-text="t('wealthHistory')"></button>
                <button @click="compTab = 'upgrades'" :class="compTab === 'upgrades' ? 'bg-[#2c2c2c] text-white font-semibold shadow-sm' : 'text-neutral-400 hover:text-white'" class="px-4 py-1.5 rounded-full text-xs md:text-sm transition whitespace-nowrap flex items-center gap-1.5">
                    <span>⚡</span> <span x-text="t('upgradesTab')"></span>
                </button>
                <button @click="compTab = 'team'" :class="compTab === 'team' ? 'bg-[#2c2c2c] text-white font-semibold shadow-sm' : 'text-neutral-400 hover:text-white'" class="px-4 py-1.5 rounded-full text-xs md:text-sm transition whitespace-nowrap flex items-center gap-1.5">
                    <span>👥</span> <span x-text="t('teamTab')"></span>
                </button>
                <button @click="compTab = 'stats'" :class="compTab === 'stats' ? 'bg-[#2c2c2c] text-white font-semibold shadow-sm' : 'text-neutral-400 hover:text-white'" class="px-4 py-1.5 rounded-full text-xs md:text-sm transition whitespace-nowrap" x-text="t('stats')"></button>
            </div>

            <!-- TAB 1: Valoración y Gráfica -->
            <div x-show="compTab === 'overview'">
                <div class="text-[11px] font-bold text-neutral-400 tracking-wider uppercase mb-1" x-text="t('companyValuationLabel')"></div>
                <div class="text-5xl font-bold tracking-tight text-white mb-2" x-text="formatWorth(selectedCompany?.netWorthValue)"></div>
                
                <div class="flex items-center gap-3 text-sm font-semibold mb-7 flex-wrap">
                    <span :class="selectedCompany?.positive ? 'text-green-400' : 'text-red-500'" x-text="formatDailyChange(selectedCompany)"></span>
                    <span class="text-xs font-normal text-neutral-400 uppercase tracking-wide" x-text="t('lastCycleTag')"></span>
                    <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[11px] px-2.5 py-0.5 rounded-full" x-text="'📈 ' + t('growthBonusLabel') + ': +' + getCompanyGrowthMultiplier(selectedCompany) + '%'"></span>
                </div>

                <div class="relative mt-2 pt-2">
                    <svg viewBox="0 0 460 175" class="w-full h-44 overflow-visible">
                        <defs>
                            <radialGradient :id="'radial-glow-comp-' + (selectedCompany?.id || 888)" cx="65%" cy="55%" r="50%">
                                <stop offset="0%" :stop-color="selectedCompany?.positive ? '#22c55e' : '#ef4444'" stop-opacity="0.22"/>
                                <stop offset="100%" :stop-color="selectedCompany?.positive ? '#22c55e' : '#ef4444'" stop-opacity="0"/>
                            </radialGradient>
                        </defs>
                        <rect x="0" y="0" width="460" height="175" :fill="'url(#radial-glow-comp-' + (selectedCompany?.id || 888) + ')'" rx="12"></rect>
                        <polyline :points="getChartData(selectedCompany).pointsStr" fill="none" :stroke="selectedCompany?.positive ? '#22c55e' : '#ef4444'" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></polyline>
                        <circle :cx="getChartData(selectedCompany).lastX" :cy="getChartData(selectedCompany).lastY" r="12" :fill="selectedCompany?.positive ? '#22c55e' : '#ef4444'" fill-opacity="0.18"></circle>
                        <circle :cx="getChartData(selectedCompany).lastX" :cy="getChartData(selectedCompany).lastY" r="4.5" :fill="selectedCompany?.positive ? '#22c55e' : '#ef4444'"></circle>
                    </svg>
                </div>
            </div>

            <!-- TAB 2: Mejoras de Empresa -->
            <div x-show="compTab === 'upgrades'">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between bg-neutral-900/80 border border-neutral-800 p-4 rounded-xl mb-6 gap-3">
                    <div>
                        <h3 class="text-sm font-bold text-white" x-text="t('upgradeHeaderTitle')"></h3>
                        <p class="text-xs text-neutral-400 mt-0.5" x-text="t('upgradeHeaderDesc')"></p>
                    </div>
                    <template x-if="currentUser">
                        <div class="bg-black/60 border border-neutral-700 px-3.5 py-2 rounded-lg text-right">
                            <div class="text-[10px] text-neutral-400 uppercase" x-text="t('yourPersonalBalance')"></div>
                            <div class="text-sm font-bold text-green-400" x-text="formatWorth(currentUser.netWorthValue)"></div>
                        </div>
                    </template>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <template x-for="upg in companyUpgradesList" :key="upg.id">
                        <div class="card-bg border border-neutral-800 p-5 rounded-xl flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-2xl" x-text="upg.icon"></span>
                                    <span class="bg-neutral-800 text-neutral-300 text-xs font-bold px-2.5 py-1 rounded-md" x-text="t('levelWord') + ' ' + getUpgradeLevel(selectedCompany, upg.id)"></span>
                                </div>
                                <h4 class="font-bold text-base text-white" x-text="t(upg.titleKey)"></h4>
                                <p class="text-xs text-neutral-400 mt-1" x-text="t(upg.descKey)"></p>
                                <div class="mt-3 text-xs text-emerald-400 font-medium" x-text="'+' + upg.bonusPct + '% ' + t('profitPerLevel')"></div>
                            </div>

                            <div class="mt-5 pt-3 border-t border-neutral-800/80 flex items-center justify-between">
                                <div>
                                    <div class="text-[10px] text-neutral-500 uppercase" x-text="t('upgradeCostLabel')"></div>
                                    <div class="text-sm font-bold text-amber-400" x-text="formatWorth(getUpgradeCost(selectedCompany, upg))"></div>
                                </div>

                                <template x-if="isCompanyOwner(selectedCompany)">
                                    <button @click="buyCompanyUpgrade(selectedCompany, upg)" 
                                            :disabled="!currentUser || currentUser.netWorthValue < getUpgradeCost(selectedCompany, upg)"
                                            :class="currentUser && currentUser.netWorthValue >= getUpgradeCost(selectedCompany, upg) ? 'bg-blue-600 hover:bg-blue-500 text-white' : 'bg-neutral-800 text-neutral-500 cursor-not-allowed'"
                                            class="px-4 py-2 rounded-lg text-xs font-semibold transition">
                                        <span x-text="t('upgradeBtn')"></span>
                                    </button>
                                </template>
                                <template x-if="!isCompanyOwner(selectedCompany)">
                                    <span class="text-[11px] text-neutral-500 italic" x-text="t('ownerOnlyAction')"></span>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- TAB 3: Equipo e Invitaciones -->
            <div x-show="compTab === 'team'">
                <template x-if="isCompanyOwner(selectedCompany)">
                    <div class="bg-neutral-900/90 border border-neutral-800 p-5 rounded-xl mb-6">
                        <h3 class="text-sm font-bold text-white mb-1" x-text="t('inviteRealUserTitle')"></h3>
                        <p class="text-xs text-neutral-400 mb-4" x-text="t('inviteRealUserDesc')"></p>
                        
                        <div class="flex flex-col sm:flex-row gap-3">
                            <div class="relative flex-grow">
                                <input type="text" x-model="inviteUsernameInput" :placeholder="t('inviteInputPlaceholder')" class="w-full bg-black border border-neutral-700 rounded-lg px-3.5 py-2 text-xs text-white focus:outline-none focus:border-blue-500">
                                
                                <div x-show="realRegisteredUsersList.length > 0" class="mt-2 flex flex-wrap gap-1.5 items-center">
                                    <span class="text-[10px] text-neutral-500" x-text="t('registeredPlayersLabel') + ':'"></span>
                                    <template x-for="rUser in realRegisteredUsersList" :key="rUser.name">
                                        <button type="button" @click="inviteUsernameInput = rUser.name" class="text-[11px] bg-neutral-800 hover:bg-neutral-700 text-neutral-200 px-2 py-0.5 rounded-md transition flex items-center gap-1">
                                            <img :src="rUser.img" class="w-3.5 h-3.5 rounded-full">
                                            <span x-text="rUser.name"></span>
                                        </button>
                                    </template>
                                </div>
                            </div>
                            <button @click="sendCompanyInvite(selectedCompany)" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg text-xs font-semibold transition whitespace-nowrap self-start">
                                📩 <span x-text="t('sendInviteBtn')"></span>
                            </button>
                        </div>
                    </div>
                </template>

                <h4 class="text-xs font-bold text-neutral-400 uppercase tracking-wider mb-3" x-text="t('companyMembersTitle')"></h4>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
                    <div class="card-bg border border-amber-500/30 p-3.5 rounded-xl flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <img :src="getUserAvatarByName(selectedCompany?.ceo)" class="w-10 h-10 rounded-lg object-cover bg-black">
                            <div>
                                <div class="text-sm font-bold text-white" x-text="selectedCompany?.ceo"></div>
                                <div class="text-[11px] text-amber-400 font-semibold" x-text="t('ceoFounderLabel')"></div>
                            </div>
                        </div>
                    </div>

                    <template x-for="member in (selectedCompany?.members || [])" :key="member">
                        <div class="card-bg border border-neutral-800 p-3.5 rounded-xl flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <img :src="getUserAvatarByName(member)" class="w-10 h-10 rounded-lg object-cover bg-black">
                                <div>
                                    <div class="text-sm font-bold text-white" x-text="member"></div>
                                    <div class="text-[11px] text-blue-400" x-text="t('memberRoleLabel')"></div>
                                </div>
                            </div>
                            <template x-if="isCompanyOwner(selectedCompany)">
                                <button @click="removeCompanyMember(selectedCompany, member)" class="text-xs text-red-400 hover:text-red-300 px-2 py-1">✕</button>
                            </template>
                        </div>
                    </template>
                </div>

                <template x-if="selectedCompany?.pendingInvites && selectedCompany.pendingInvites.length > 0">
                    <div>
                        <h4 class="text-xs font-bold text-neutral-500 uppercase tracking-wider mb-2" x-text="t('pendingInvitesTitle')"></h4>
                        <div class="flex flex-wrap gap-2">
                            <template x-for="inv in selectedCompany.pendingInvites" :key="inv">
                                <span class="bg-neutral-900 border border-neutral-800 text-neutral-300 text-xs px-3 py-1.5 rounded-lg flex items-center gap-2">
                                    <span>⏳</span>
                                    <span x-text="inv"></span>
                                </span>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- TAB 4: Estadísticas de la Empresa -->
            <div x-show="compTab === 'stats'" class="space-y-4 text-sm">
                <div class="flex justify-between border-b border-neutral-800 pb-3">
                    <span class="text-neutral-400" x-text="t('companyLevelStat')"></span>
                    <span class="font-bold text-blue-400 text-base" x-text="t('levelWord') + ' ' + (selectedCompany?.level || 1)"></span>
                </div>
                <div class="flex justify-between border-b border-neutral-800 pb-3">
                    <span class="text-neutral-400" x-text="t('companyRankStat')"></span>
                    <span class="font-bold text-amber-400" x-text="'#' + getCompanyRank(selectedCompany)"></span>
                </div>
                <div class="flex justify-between border-b border-neutral-800 pb-3">
                    <span class="text-neutral-400" x-text="t('ceoLabel')"></span>
                    <span class="font-semibold text-white" x-text="selectedCompany?.ceo"></span>
                </div>
                <div class="flex justify-between border-b border-neutral-800 pb-3">
                    <span class="text-neutral-400" x-text="t('growthBonusLabel')"></span>
                    <span class="font-bold text-green-400" x-text="'+' + getCompanyGrowthMultiplier(selectedCompany) + '% ' + t('perCycleWord')"></span>
                </div>
                <div class="flex justify-between border-b border-neutral-800 pb-3">
                    <span class="text-neutral-400" x-text="t('totalMembersStat')"></span>
                    <span class="font-medium" x-text="1 + (selectedCompany?.members?.length || 0)"></span>
                </div>
                <div class="flex justify-between border-b border-neutral-800 pb-3">
                    <span class="text-neutral-400" x-text="t('sourceWealth')"></span>
                    <span class="font-medium" x-text="selectedCompany?.sector || 'Corporate'"></span>
                </div>
            </div>
        </div>
    </main>

    <!-- MODAL 1: Registro / Login Roblox con Contraseña Segura -->
    <div x-show="showRegisterModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 px-4" style="display: none;">
        <div class="card-bg p-8 rounded-2xl border border-neutral-800 max-w-md w-full relative">
            <button @click="showRegisterModal = false" class="absolute top-4 right-4 text-neutral-400 hover:text-white text-xl">×</button>
            <h2 class="serif-font text-2xl font-bold mb-2 text-white" x-text="t('modalTitle')"></h2>
            <p class="text-xs text-neutral-400 mb-6" x-text="t('modalDesc')"></p>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('robloxUser')"></label>
                    <input type="text" x-model="regUsername" @keydown.enter="handleAuthUser()" placeholder="ej. Giacolamela" class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('password')"></label>
                    <input type="password" x-model="regPassword" @keydown.enter="handleAuthUser()" placeholder="••••••••" class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <button @click="handleAuthUser()" :disabled="isRegistering" class="w-full bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition flex items-center justify-center">
                    <span x-show="!isRegistering" x-text="t('authButton')"></span>
                    <span x-show="isRegistering" x-text="t('verifying')"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: Editar Biografía y Rol -->
    <div x-show="showBioModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 px-4" style="display: none;">
        <div class="card-bg p-8 rounded-2xl border border-neutral-800 max-w-lg w-full relative">
            <button @click="showBioModal = false" class="absolute top-4 right-4 text-neutral-400 hover:text-white text-xl">×</button>
            <h2 class="serif-font text-2xl font-bold mb-2 text-white" x-text="t('editBioTitle')"></h2>
            <p class="text-xs text-neutral-400 mb-4" x-text="t('editBioDesc')"></p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('sourceWealth')"></label>
                    <select x-model="tempSource" class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        <template x-for="cat in allSectors" :key="cat">
                            <option :value="cat" x-text="cat"></option>
                        </template>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('biography')"></label>
                    <textarea x-model="tempBioText" rows="4" class="w-full bg-black border border-neutral-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="Escribe tu biografía..."></textarea>
                </div>

                <button @click="saveUserBio()" class="w-full bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition" x-text="t('saveBioButton')"></button>
            </div>
        </div>
    </div>

    <!-- MODAL 3: Crear Empresa -->
    <div x-show="showCompanyModal" class="fixed inset-0 bg-black/85 flex items-center justify-center z-50 px-4 py-6 overflow-y-auto" style="display: none;">
        <div class="card-bg p-6 sm:p-8 rounded-2xl border border-neutral-700 max-w-md w-full relative shadow-2xl my-auto">
            <button @click="showCompanyModal = false" class="absolute top-4 right-4 text-neutral-400 hover:text-white text-xl">×</button>
            
            <div x-show="isAutoCompanyPrompt" class="inline-block bg-blue-600/20 border border-blue-500/40 text-blue-300 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase mb-2" x-text="t('welcomeCompanyBadge')"></div>
            
            <h2 class="serif-font text-2xl font-bold mb-2 text-white" x-text="t('createCompanyTitle')"></h2>
            <p class="text-xs text-neutral-400 mb-5" x-text="t('createCompanyDesc')"></p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('companyNameLabel')"></label>
                    <input type="text" x-model="newCompanyName" placeholder="ej. Nexus Corp" class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('sourceWealth')"></label>
                    <select x-model="newCompanySector" class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        <template x-for="cat in allSectors" :key="cat">
                            <option :value="cat" x-text="cat"></option>
                        </template>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('companyInvestmentLabel')"></label>
                    <input type="number" step="0.5" min="1" x-model.number="newCompanyInvestment" placeholder="15.0" class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    <p class="text-[11px] text-neutral-500 mt-1" x-text="t('investmentDeductNote')"></p>
                </div>

                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1.5" x-text="t('companyLogoLabel')"></label>
                    
                    <div class="flex items-center gap-3 mb-2">
                        <img :src="newCompanyLogo || presetCompanyLogos[0]" class="w-14 h-14 rounded-xl object-cover bg-black border border-neutral-700 shrink-0" alt="Preview">
                        <div class="flex-grow">
                            <label class="cursor-pointer bg-neutral-800 hover:bg-neutral-700 text-white text-xs font-semibold px-3 py-2 rounded-lg border border-neutral-600 inline-flex items-center gap-2 transition w-full justify-center">
                                <span>📁</span>
                                <span x-text="t('uploadFromDeviceBtn')"></span>
                                <input type="file" accept="image/*" @change="handleLogoFileUpload($event, 'create')" class="hidden">
                            </label>
                            <input type="text" x-model="newCompanyLogo" placeholder="O pega una URL de imagen..." class="w-full bg-black border border-neutral-800 rounded-lg px-2.5 py-1.5 text-[11px] text-neutral-300 mt-1.5 focus:outline-none focus:border-blue-500">
                        </div>
                    </div>

                    <div class="flex items-center gap-2 mt-2">
                        <span class="text-[10px] text-neutral-500">Emblemas:</span>
                        <template x-for="(preset, pIdx) in presetCompanyLogos" :key="pIdx">
                            <img :src="preset" @click="newCompanyLogo = preset" :class="newCompanyLogo === preset ? 'ring-2 ring-blue-500' : 'opacity-70 hover:opacity-100'" class="w-8 h-8 rounded-lg cursor-pointer bg-black object-cover transition">
                        </template>
                    </div>
                </div>

                <div class="flex gap-2 pt-2">
                    <button x-show="isAutoCompanyPrompt" @click="showCompanyModal = false" class="w-1/3 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 px-3 py-2.5 rounded-lg text-xs font-semibold transition" x-text="t('laterButton')"></button>
                    <button @click="createCompany()" class="flex-grow bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition" x-text="t('launchCompanyBtn')"></button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL 4: Editar Empresa -->
    <div x-show="showEditCompanyModal" class="fixed inset-0 bg-black/85 flex items-center justify-center z-50 px-4" style="display: none;">
        <div class="card-bg p-6 sm:p-8 rounded-2xl border border-neutral-800 max-w-md w-full relative">
            <button @click="showEditCompanyModal = false" class="absolute top-4 right-4 text-neutral-400 hover:text-white text-xl">×</button>
            <h2 class="serif-font text-2xl font-bold mb-2 text-white" x-text="t('editCompanyTitle')"></h2>
            <p class="text-xs text-neutral-400 mb-6" x-text="t('editCompanyDesc')"></p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('companyNameLabel')"></label>
                    <input type="text" x-model="editCompanyNameInput" class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1.5" x-text="t('companyLogoLabel')"></label>
                    <div class="flex items-center gap-3 mb-2">
                        <img :src="editCompanyLogoInput || presetCompanyLogos[0]" class="w-14 h-14 rounded-xl object-cover bg-black border border-neutral-700 shrink-0" alt="Preview">
                        <div class="flex-grow">
                            <label class="cursor-pointer bg-neutral-800 hover:bg-neutral-700 text-white text-xs font-semibold px-3 py-2 rounded-lg border border-neutral-600 inline-flex items-center gap-2 transition w-full justify-center">
                                <span>📁</span>
                                <span x-text="t('uploadFromDeviceBtn')"></span>
                                <input type="file" accept="image/*" @change="handleLogoFileUpload($event, 'edit')" class="hidden">
                            </label>
                            <input type="text" x-model="editCompanyLogoInput" placeholder="O pega una URL..." class="w-full bg-black border border-neutral-800 rounded-lg px-2.5 py-1.5 text-[11px] text-neutral-300 mt-1.5 focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                    <div class="flex items-center gap-2 mt-2">
                        <template x-for="(preset, pIdx) in presetCompanyLogos" :key="pIdx">
                            <img :src="preset" @click="editCompanyLogoInput = preset" :class="editCompanyLogoInput === preset ? 'ring-2 ring-blue-500' : 'opacity-70 hover:opacity-100'" class="w-8 h-8 rounded-lg cursor-pointer bg-black object-cover transition">
                        </template>
                    </div>
                </div>
                <button @click="saveCompanyChanges()" class="w-full bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition" x-text="t('saveBioButton')"></button>
            </div>
        </div>

    <!-- MODAL 5: Centro de Notificaciones e Invitaciones (Empresas y Amigos) -->
    <div x-show="showInvitesModal" class="fixed inset-0 bg-black/85 flex items-center justify-center z-50 px-4" style="display: none;">
        <div class="card-bg p-6 sm:p-8 rounded-2xl border border-neutral-800 max-w-md w-full relative shadow-2xl">
            <button @click="showInvitesModal = false" class="absolute top-4 right-4 text-neutral-400 hover:text-white text-xl">×</button>
            
            <div class="flex items-center gap-2 mb-2">
                <span class="text-2xl">🔔</span>
                <h2 class="serif-font text-2xl font-bold text-white" x-text="t('notificationsTitle')"></h2>
            </div>
            <p class="text-xs text-neutral-400 mb-6" x-text="t('notificationsDesc')"></p>

            <div class="space-y-6 max-h-96 overflow-y-auto pr-1">
                <!-- Invitaciones de Empresas -->
                <div>
                    <h3 class="text-xs font-bold text-blue-400 uppercase tracking-wider mb-3 flex items-center gap-1.5">
                        <span>🏢</span> <span x-text="t('companyInvitesHeader')"></span> (<span x-text="pendingInvitesForCurrentUser.length"></span>)
                    </h3>
                    
                    <div x-show="pendingInvitesForCurrentUser.length === 0" class="text-xs text-neutral-500 italic bg-black/30 p-3 rounded-xl">
                        <span x-text="t('noCompanyInvites')"></span>
                    </div>

                    <div class="space-y-2.5">
                        <template x-for="comp in pendingInvitesForCurrentUser" :key="comp.name">
                            <div class="bg-black/60 border border-neutral-800 p-3.5 rounded-xl flex items-center justify-between gap-3">
                                <div class="flex items-center gap-3">
                                    <img :src="comp.img" class="w-10 h-10 rounded-lg object-cover bg-black">
                                    <div>
                                        <div class="text-sm font-bold text-white" x-text="comp.name"></div>
                                        <div class="text-[11px] text-neutral-400" x-text="'CEO: ' + comp.ceo"></div>
                                    </div>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <button @click="respondToCompanyInvite(comp, true)" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition" x-text="t('acceptBtn')"></button>
                                    <button @click="respondToCompanyInvite(comp, false)" class="bg-neutral-800 hover:bg-neutral-700 text-neutral-300 px-2.5 py-1.5 rounded-lg text-xs transition">✕</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Solicitudes de Amistad -->
                <div class="pt-4 border-t border-neutral-800">
                    <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-3 flex items-center gap-1.5">
                        <span>👥</span> <span x-text="t('friendRequestsHeader')"></span> (<span x-text="incomingFriendRequests.length"></span>)
                    </h3>

                    <div x-show="incomingFriendRequests.length === 0" class="text-xs text-neutral-500 italic bg-black/30 p-3 rounded-xl">
                        <span x-text="t('noFriendRequests')"></span>
                    </div>

                    <div class="space-y-2.5">
                        <template x-for="reqName in incomingFriendRequests" :key="reqName">
                            <div class="bg-black/60 border border-neutral-800 p-3.5 rounded-xl flex items-center justify-between gap-3">
                                <div class="flex items-center gap-3">
                                    <img :src="getUserAvatarByName(reqName)" class="w-10 h-10 rounded-full object-cover bg-black">
                                    <div>
                                        <div class="text-sm font-bold text-white" x-text="reqName"></div>
                                        <div class="text-[11px] text-amber-400" x-text="t('wantsToBeFriend')"></div>
                                    </div>
                                </div>
                                <div class="flex items-center gap-1.5">
                                    <button @click="acceptFriendRequest(reqName)" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition" x-text="t('acceptBtn')"></button>
                                    <button @click="rejectFriendRequest(reqName)" class="bg-neutral-800 hover:bg-neutral-700 text-neutral-300 px-2.5 py-1.5 rounded-lg text-xs transition">✕</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </div>

        function deterministicRandom(seedStr) {
            let h = 2166136261 >>> 0;
            for (let i = 0; i < seedStr.length; i++) {
                h ^= seedStr.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            h += h << 13;
            h ^= h >>> 7;
            h += h << 3;
            h ^= h >>> 17;
            h += h << 5;
            return (h >>> 0) / 4294967296;
        }

                    }, 4000);

                    return translations[this.lang]?.[key] || translations['es'][key] || key;

                get formattedCountdown() {
                    let totalSeconds = Math.max(0, Math.floor(this.timeRemainingMs / 1000));
                    let hours = Math.floor(totalSeconds / 3600);
                    let minutes = Math.floor((totalSeconds % 3600) / 60);
                    let seconds = totalSeconds % 60;
                    const pad = (n) => String(n).padStart(2, '0');
                    return `${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s`;
                },
                get top5Gainers() {
                    return [...this.people].filter(p => p.changeVal > 0).sort((a, b) => b.changeVal - a.changeVal).slice(0, 5);
                },

                    return [...this.people].filter(p => p.changeVal < 0).sort((a, b) => a.changeVal - b.changeVal).slice(0, 5);
                },

                    this.lang = newLang;
                    localStorage.setItem('empire_lang', newLang);
                },

                    this.currentFilter = filterName;

                    this.selectedPerson = null;
                    this.selectedCompany = null;
                    this.showFriendsView = false;
                    this.showCategoriesDropdown = false;
                    this.searchQuery = '';
                },
                formatWorth(val) {
                    if (val === undefined || val === null) return '$0B';
                    if (val >= 1000) {
                        let trillions = val / 1000;
                        return '$' + trillions.toFixed(1) + 'T';
                    }
                    return val % 1 === 0 ? '$' + val.toFixed(0) + 'B' : '$' + val.toFixed(1) + 'B';
                },
                isTrillionaire(item) {
                    return item && item.netWorthValue >= 1000;
                },
                getTrillionaireLabel(item) {
                    if (!this.isTrillionaire(item)) return '';
                    if (this.firstTrillionaireName && item.name && item.name.toLowerCase() === this.firstTrillionaireName.toLowerCase()) {
                        return this.t('firstTrillionaire');
                    }
                    return '';
                },
                hasDailyChange(item) {
                    return item && item.changeVal !== undefined && item.changeVal !== 0;
                },
                formatDailyChange(item) {
                    if (!this.hasDailyChange(item)) return '▲ +$0B (0.0%)';
                    let prevWorth = item.netWorthValue - item.changeVal;
                    let percentage = prevWorth > 0 ? (item.changeVal / prevWorth) * 100 : 0;
                    let sign = item.changeVal > 0 ? '+' : '-';
                    let absChange = Math.abs(item.changeVal);
                    let valStr = '';
                    if (absChange >= 1000) {
                        valStr = `$${(absChange / 1000).toFixed(1)}T`;
                    } else if (absChange >= 1) {
                        valStr = `$${absChange.toFixed(1)}B`;
                    } else {
                        valStr = `$${(absChange * 1000).toFixed(0)}M`;
                    }
                    let symbol = item.changeVal > 0 ? '▲' : '▼';
                    let pctSign = percentage >= 0 ? '+' : '';
                    return `${symbol} ${sign}${valStr} (${pctSign}${percentage.toFixed(1)}%)`;
                },
                isBloodActive(item) {
                    return item && item.changeVal !== undefined && item.changeVal <= -1.0;
                },
                getFireTier(item) {
                    if (!item || item.changeVal === undefined || item.changeVal < 1.0) return 0;
                    const gain = item.changeVal;
                    if (gain >= 40) return 40;
                    if (gain >= 30) return 30;
                    if (gain >= 20) return 20;
                    if (gain >= 15) return 15;
                    if (gain >= 10) return 10;
                    if (gain >= 5) return 5;
                    return 1;
                },
                hasFire(item) {
                    return this.getFireTier(item) > 0;
                },
                getFireBadgeClass(item) {
                    const tier = this.getFireTier(item);
                    return tier > 0 ? `fire-tier-${tier}` : '';
                },
                getContainerGlowClass(item) {
                    if (this.isBloodActive(item)) return 'blood-glow';
                    const tier = this.getFireTier(item);
                    return tier > 0 ? `glow-tier-${tier}` : '';
                },
                getFireLabel(item) {
                    const tier = this.getFireTier(item);
                    return tier > 0 ? this.t(`fire${tier}`) : '';
                },
                getChartData(item) {
                    if (!item) return { pointsStr: '10,85 440,85', lastX: 440, lastY: 85 };
                    let vals = (item.history && item.history.length >= 2) ? [...item.history] : [item.netWorthValue - (item.changeVal || 0), item.netWorthValue];
                    
                    while (vals.length < 24) {
                        let first = vals[0];
                        let r = deterministicRandom(`${item.name || 'item'}_pad_${vals.length}`);
                        let step = (r - 0.5) * (first * 0.04);
                        vals.unshift(Math.max(5, Number((first - step).toFixed(2))));
                    }

                    let minV = Math.min(...vals);
                    let maxV = Math.max(...vals);
                    let range = maxV - minV;
                    if (range < 0.01) range = 1;

                    const width = 445;
                    const startX = 10;
                    const topPad = 18;
                    const bottomPad = 155;
                    const usableH = bottomPad - topPad;

                    let coords = vals.map((v, idx) => {
                        let x = startX + (idx / (vals.length - 1)) * (width - startX);
                        let norm = (v - minV) / range;
                        let y = bottomPad - norm * usableH;
                        return { x: Number(x.toFixed(1)), y: Number(y.toFixed(1)) };
                    });

                    let pointsStr = coords.map(c => `${c.x},${c.y}`).join(' ');
                    let last = coords[coords.length - 1];
                    return { pointsStr, lastX: last.x, lastY: last.y };

                syncGlobalMarketToCycle(targetCycle) {
                    let syncedPeople = getBasePeople();
                    let syncedCompanies = [];

                    try {
                        let savedComps = localStorage.getItem('empire_user_companies');
                        if (savedComps) {
                            let parsedComps = JSON.parse(savedComps);
                            if (Array.isArray(parsedComps)) {
                                syncedCompanies = parsedComps;
                            }
                        }
                    } catch (e) {}

                    syncedPeople.forEach(p => {
                        p.history = [p.netWorthValue];
                    });
                    syncedCompanies.forEach(c => {
                        if (!c.history || c.history.length === 0) c.history = [c.netWorthValue];
                    });

                    const startCycle = Math.max(1, targetCycle - 32);

                    for (let cycle = startCycle; cycle <= targetCycle; cycle++) {
                        syncedCompanies.forEach(company => {
                            let r1 = deterministicRandom(`comp_${company.name.toLowerCase()}_c${cycle}_a`);
                            let r2 = deterministicRandom(`comp_${company.name.toLowerCase()}_c${cycle}_b`);
                            
                            let levelBonus = ((company.level || 1) - 1) * 0.008;
                            let pctChange = 0;

                            if (r1 < 0.22) {
                                pctChange = levelBonus * 0.5;
                            } else if (r1 < 0.72) {
                                pctChange = 0.005 + r2 * 0.045 + levelBonus;
                            } else {
                                pctChange = -(0.005 + r2 * 0.032) + (levelBonus * 0.4);
                            }

                            let companyDelta = Number((company.netWorthValue * pctChange).toFixed(1));
                            if (Math.abs(companyDelta) < 0.1) companyDelta = 0;

                            company.netWorthValue = Math.max(5.0, Number((company.netWorthValue + companyDelta).toFixed(1)));
                            company.changeVal = companyDelta;
                            company.positive = companyDelta >= 0;
                            company.history.push(company.netWorthValue);
                        });

                        syncedPeople.forEach(person => {
                            let r1 = deterministicRandom(`pers_${person.name.toLowerCase()}_c${cycle}_a`);
                            let r2 = deterministicRandom(`pers_${person.name.toLowerCase()}_c${cycle}_b`);
                            let pctChange = 0;

                            if (r1 < 0.20) {
                                pctChange = 0;
                            } else if (r1 < 0.56) {
                                pctChange = 0.003 + r2 * 0.038;
                            } else if (r1 < 0.70) {
                                pctChange = 0.025 + r2 * 0.065;
                            } else {
                                pctChange = -(0.005 + r2 * 0.048);
                            }

                            let delta = Number((person.netWorthValue * pctChange).toFixed(1));
                            if (Math.abs(delta) < 0.1) delta = 0;

                            person.netWorthValue = Math.max(10.0, Number((person.netWorthValue + delta).toFixed(1)));
                            person.changeVal = delta;
                            person.positive = delta >= 0;
                            person.history.push(person.netWorthValue);

                            if (!person.peakNetWorth || person.netWorthValue > person.peakNetWorth) {
                                person.peakNetWorth = Number(person.netWorthValue.toFixed(1));
                            }
                        });

                        syncedPeople.sort((a, b) => b.netWorthValue - a.netWorthValue);
                        syncedPeople.forEach((p, idx) => {
                            p.id = idx + 1;
                            if (!p.peakRank || p.id < p.peakRank) {
                                p.peakRank = p.id;
                            }
                        });
                    }

                    syncedCompanies.sort((a, b) => b.netWorthValue - a.netWorthValue);

                    this.people = syncedPeople;
                    this.companies = syncedCompanies;
                    this.lastSimulatedCycle = targetCycle;

                    if (this.selectedTop5Person) {
                        let updatedTop = this.people.find(p => p.name === this.selectedTop5Person.name);
                        this.selectedTop5Person = updatedTop || (this.people.length > 0 ? this.people[0] : null);
                    } else if (this.people.length > 0) {
                        this.selectedTop5Person = this.people[0];
                    }

                    if (this.selectedPerson) {
                        let updatedSel = this.people.find(p => p.name === this.selectedPerson.name);
                        if (updatedSel) this.selectedPerson = updatedSel;
                    }

                    if (this.selectedCompany) {
                        let updatedComp = this.companies.find(c => c.name.toLowerCase() === this.selectedCompany.name.toLowerCase());
                        if (updatedComp) this.selectedCompany = updatedComp;
                    }
                },
                getCurrentGlobalCycle() {
                    const elapsed = Math.max(0, Date.now() - GLOBAL_EPOCH_MS);
                    return Math.floor(elapsed / TWELVE_HOURS_MS);
                },
                startCountdownLoop() {
                    if (this.timerInterval) clearInterval(this.timerInterval);
                    this.timerInterval = setInterval(() => {
                        let now = Date.now();
                        let currentCycle = this.getCurrentGlobalCycle();
                        let nextCycleStart = GLOBAL_EPOCH_MS + (currentCycle + 1) * TWELVE_HOURS_MS;
                        
                        this.nextUpdateTimestamp = nextCycleStart;
                        this.timeRemainingMs = Math.max(0, nextCycleStart - now);

                        if (currentCycle > this.lastSimulatedCycle) {
                            this.syncGlobalMarketToCycle(currentCycle);
                        }
                    }, 1000);
                },
                async refreshRobloxProfile(userObj) {
                    try {
                        let userRes = await fetch(`https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(userObj.name)}&limit=5`);
                        let userData = await userRes.json();
                        if (userData.data && userData.data.length > 0) {
                            let matchedUser = userData.data.find(u => u.name.toLowerCase() === userObj.name.toLowerCase()) || userData.data[0];
                            let userId = matchedUser.id;
                            let thumbRes = await fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=false`);
                            let thumbData = await thumbRes.json();

                                userObj.img = thumbData.data[0].imageUrl;
                                userObj.name = matchedUser.name;
                            }
                        }
                    } catch (e) {}

                async handleAuthUser() {

                        this.notify('Por favor, introduce un nombre de usuario de Roblox.', '⚠️');

                    let cleanUsername = this.regUsername.trim();
