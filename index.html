<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxIndex</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Georgia:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .serif-font {
            font-family: 'Georgia', serif;
        }
        .card-bg {
            background-color: #181818;
        }
        .active-card {
            background-color: #242424;
            border-left: 3px solid #3b82f6;
        }

        @keyframes flicker {
            0%, 100% { transform: scale(1) rotate(-2deg); opacity: 0.92; }
            50% { transform: scale(1.18) rotate(2deg); opacity: 1; }
        }
        @keyframes purplePulse {
            0%, 100% { filter: hue-rotate(265deg) saturate(2.2) drop-shadow(0 0 14px #a855f7); transform: scale(1.08) rotate(-3deg); }
            50% { filter: hue-rotate(280deg) saturate(2.6) drop-shadow(0 0 24px #c084fc); transform: scale(1.26) rotate(3deg); }
        }
        @keyframes drip {
            0% { transform: translateY(-3px); opacity: 0.8; filter: drop-shadow(0 0 6px #dc2626); }
            50% { transform: translateY(4px); opacity: 1; filter: drop-shadow(0 0 10px #991b1b); }
            100% { transform: translateY(-3px); opacity: 0.8; filter: drop-shadow(0 0 6px #dc2626); }
        }
        @keyframes goldShine {
            0%, 100% { box-shadow: 0 0 8px rgba(250, 204, 21, 0.5); }
            50% { box-shadow: 0 0 16px rgba(250, 204, 21, 0.9); }
        }

        .fire-badge {
            display: inline-block;
            animation: flicker 1.3s infinite ease-in-out;
        }
        .blood-badge {
            display: inline-block;
            animation: drip 1.2s infinite ease-in-out;
        }
        .trillionaire-badge {
            background: linear-gradient(90deg, #f59e0b, #fde047, #d97706);
            color: #000000;
            font-weight: 800;
            letter-spacing: 0.05em;
            animation: goldShine 2s infinite ease-in-out;
        }

        .fire-tier-1 { filter: drop-shadow(0 0 7px #fb923c) brightness(1.1); }
        .glow-tier-1 { box-shadow: 0 0 14px rgba(251, 146, 60, 0.28); border: 1px solid rgba(251, 146, 60, 0.45); }
        .fire-tier-5 { filter: saturate(1.6) drop-shadow(0 0 11px #f97316); }
        .glow-tier-5 { box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); border: 1px solid rgba(249, 115, 22, 0.65); }
        .fire-tier-10 { filter: hue-rotate(28deg) brightness(1.35) drop-shadow(0 0 13px #facc15); }
        .glow-tier-10 { box-shadow: 0 0 22px rgba(250, 204, 21, 0.45); border: 1px solid rgba(250, 204, 21, 0.75); }
        .fire-tier-15 { filter: hue-rotate(-25deg) saturate(2) drop-shadow(0 0 14px #ef4444); }
        .glow-tier-15 { box-shadow: 0 0 25px rgba(239, 68, 68, 0.5); border: 1px solid rgba(239, 68, 68, 0.8); }
        .fire-tier-20 { filter: hue-rotate(95deg) saturate(1.8) drop-shadow(0 0 14px #22c55e); }
        .glow-tier-20 { box-shadow: 0 0 25px rgba(34, 197, 94, 0.5); border: 1px solid rgba(34, 197, 94, 0.8); }
        .fire-tier-30 { filter: hue-rotate(195deg) saturate(2) drop-shadow(0 0 16px #3b82f6); }
        .glow-tier-30 { box-shadow: 0 0 28px rgba(59, 130, 246, 0.55); border: 1px solid rgba(59, 130, 246, 0.85); }
        .fire-tier-40 { animation: purplePulse 1.5s infinite ease-in-out; }
        .glow-tier-40 { box-shadow: 0 0 32px rgba(168, 85, 247, 0.65), inset 0 0 16px rgba(168, 85, 247, 0.25); border: 1px solid #a855f7; }

        .blood-glow {
            box-shadow: 0 0 22px rgba(220, 38, 38, 0.4);
            border: 1px solid rgba(220, 38, 38, 0.7);
        }
    </style>
</head>
<body x-data="empireApp()" x-init="initEmpire()" class="min-h-screen px-4 sm:px-6 py-4 flex flex-col">

    <!-- Notificación Toast Flotante -->
    <div x-show="toastMessage" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 translate-y-4"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         class="fixed bottom-6 right-6 z-50 max-w-sm bg-neutral-900 border border-neutral-700 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3"
         style="display: none;">
        <span class="text-lg" x-text="toastIcon"></span>
        <span class="text-xs font-medium" x-text="toastMessage"></span>
        <button @click="toastMessage = ''" class="text-neutral-400 hover:text-white ml-2 text-base">×</button>
    </div>

    <!-- Título Principal -->
    <div class="max-w-7xl mx-auto w-full pt-4 pb-2 text-center">
        <h1 class="serif-font text-4xl md:text-5xl font-bold tracking-tight uppercase">
            <span class="fire-badge fire-tier-5 mr-2">🔥</span><span x-text="t('title')"></span><span class="fire-badge fire-tier-5 ml-2">🔥</span>
        </h1>
        
        <div class="mt-3 inline-flex items-center gap-2.5 bg-[#141414] border border-neutral-800 px-4 py-1.5 rounded-full text-xs text-neutral-300 shadow-lg">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <span x-text="t('nextUpdateLabel')"></span>
            <span class="font-mono font-bold text-white tracking-wider" x-text="formattedCountdown"></span>
        </div>
    </div>

    <!-- Barra Superior de Navegación -->
    <header class="flex flex-col md:flex-row items-center justify-between text-sm font-medium border-b border-neutral-800 pb-3 mb-8 max-w-7xl mx-auto w-full gap-4 mt-4">
        <div class="flex items-center space-x-6 flex-wrap">
            <button @click="resetViews('top5')" :class="currentFilter === 'top5' && !selectedPerson && !selectedCompany ? 'text-white border-b-2 border-white pb-1' : 'text-neutral-400 hover:text-white'" x-text="t('top5')"></button>
            <button @click="resetViews('all')" :class="currentFilter === 'all' && !selectedCategory && !selectedPerson && !selectedCompany ? 'text-white border-b-2 border-white pb-1' : 'text-neutral-400 hover:text-white'" x-text="t('top')"></button>
            <button @click="resetViews('women')" :class="currentFilter === 'women' && !selectedPerson && !selectedCompany ? 'text-white border-b-2 border-white pb-1' : 'text-neutral-400 hover:text-white'" x-text="t('women')"></button>
            <button @click="resetViews('companies')" :class="currentFilter === 'companies' && !selectedPerson && !selectedCompany ? 'text-white border-b-2 border-white pb-1' : 'text-neutral-400 hover:text-white'" x-text="t('companiesTab')"></button>
            
            <div class="relative" @click.away="showCategoriesDropdown = false">
                <button @click="showCategoriesDropdown = !showCategoriesDropdown; currentFilter = 'categories'; selectedPerson = null; selectedCompany = null;" :class="selectedCategory || showCategoriesDropdown ? 'text-white border-b-2 border-white pb-1' : 'text-neutral-400 hover:text-white'" class="flex items-center gap-1">
                    <span x-text="t('categories')"></span> <span class="text-xs">▾</span>
                </button>

                <div x-show="showCategoriesDropdown" class="absolute left-0 mt-2 w-64 card-bg border border-neutral-800 rounded-xl shadow-2xl py-2 z-50" style="display: none;">
                    <template x-for="cat in uniqueCategories" :key="cat">
                        <button @click="selectedCategory = cat; showCategoriesDropdown = false; currentFilter = 'categories';" class="w-full text-left px-4 py-2.5 text-sm hover:bg-neutral-800 text-neutral-300 hover:text-white transition flex items-center justify-between">
                            <span x-text="cat"></span>
                            <span class="text-xs text-neutral-500" x-text="people.filter(p => p.source === cat).length"></span>
                        </button>
                    </template>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-3 w-full md:w-auto justify-end flex-wrap">
            <!-- Search Input -->
            <div class="relative w-full sm:w-56">
                <input type="text" x-model="searchQuery" :placeholder="t('searchPlaceholder')" class="w-full bg-[#181818] border border-neutral-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-neutral-600">
            </div>

            <div class="relative">
                <select x-model="lang" @change="changeLanguage(lang)" class="bg-[#181818] border border-neutral-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-neutral-600 cursor-pointer">
                    <option value="en">🇺🇸 English</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="it">🇮🇹 Italiano</option>
                    <option value="pt">🇧🇷 Português</option>
                    <option value="de">🇩🇪 Deutsch</option>
                </select>
            </div>

            <!-- Botón de Notificaciones de Invitaciones -->
            <template x-if="currentUser && pendingInvitesForCurrentUser.length > 0">
                <button @click="showInvitesModal = true" class="relative bg-amber-500/20 border border-amber-500/50 hover:bg-amber-500/30 text-amber-300 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 animate-pulse">
                    <span>🔔</span>
                    <span x-text="pendingInvitesForCurrentUser.length"></span>
                </button>
            </template>

            <template x-if="!currentUser">
                <button @click="showRegisterModal = true" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-lg text-xs font-semibold transition whitespace-nowrap" x-text="t('registerLogin')"></button>
            </template>

            <template x-if="currentUser">
                <div class="relative" @click.away="showUserMenu = false">
                    <div @click="showUserMenu = !showUserMenu" class="flex items-center gap-2 bg-neutral-900 border border-neutral-800 px-3 py-1.5 rounded-lg cursor-pointer hover:bg-neutral-800 transition">
                        <div class="relative">
                            <img :src="currentUser.img" class="w-6 h-6 rounded-full object-cover bg-black" alt="Avatar">
                            <span class="absolute -bottom-0.5 -right-0.5 w-2 h-2 rounded-full bg-green-500 ring-1 ring-black"></span>
                        </div>
                        <span class="text-xs font-medium text-white" x-text="currentUser.name"></span>
                        <span class="text-xs text-neutral-400">▾</span>
                    </div>

                    <div x-show="showUserMenu" class="absolute right-0 mt-2 w-60 card-bg border border-neutral-800 rounded-xl shadow-2xl py-2 z-50" style="display: none;">
                        <button @click="openProfile(currentUser); showUserMenu = false" class="w-full text-left px-4 py-2 text-xs hover:bg-neutral-800 text-neutral-300 hover:text-white transition flex items-center gap-2">
                            👤 <span x-text="t('myProfile')"></span>
                        </button>
                        <button @click="openBioEditor(currentUser); showUserMenu = false" class="w-full text-left px-4 py-2 text-xs hover:bg-neutral-800 text-neutral-300 hover:text-white transition flex items-center gap-2">
                            ✏️ <span x-text="t('editBio')"></span>
                        </button>
                        <button @click="openCompanyModal(false); showUserMenu = false" class="w-full text-left px-4 py-2 text-xs hover:bg-neutral-800 text-blue-400 hover:text-blue-300 transition flex items-center gap-2 font-semibold">
                            🏢 <span x-text="t('createAnotherCompany')"></span>
                        </button>
                        <template x-if="userOwnedCompanies.length > 0">
                            <div class="border-t border-neutral-800 my-1 pt-1">
                                <div class="px-4 py-1 text-[10px] text-neutral-500 uppercase font-bold" x-text="t('myCompaniesLabel')"></div>
                                <template x-for="comp in userOwnedCompanies" :key="comp.name">
                                    <button @click="openCompanyDashboard(comp); showUserMenu = false" class="w-full text-left px-4 py-1.5 text-xs hover:bg-neutral-800 text-emerald-400 hover:text-emerald-300 transition flex items-center justify-between">
                                        <span class="truncate" x-text="comp.name"></span>
                                        <span class="text-[10px] text-neutral-500" x-text="'LVL ' + (comp.level || 1)"></span>
                                    </button>
                                </template>
                            </div>
                        </template>
                        <template x-if="pendingInvitesForCurrentUser.length > 0">
                            <button @click="showInvitesModal = true; showUserMenu = false" class="w-full text-left px-4 py-2 text-xs hover:bg-neutral-800 text-amber-400 transition flex items-center justify-between">
                                <span class="flex items-center gap-2">🔔 <span x-text="t('invitesMenu')"></span></span>
                                <span class="bg-amber-500 text-black font-bold px-1.5 py-0.5 rounded-full text-[10px]" x-text="pendingInvitesForCurrentUser.length"></span>
                            </button>
                        </template>
                        <div class="border-t border-neutral-800 my-1"></div>
                        <button @click="logoutUser(); showUserMenu = false" class="w-full text-left px-4 py-2 text-xs hover:bg-neutral-800 text-red-400 transition flex items-center gap-2">
                            🚪 <span x-text="t('logout')"></span>
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </header>

    <!-- Main Content (Leaderboards) -->
    <main x-show="!selectedPerson && !selectedCompany" class="flex-grow max-w-7xl mx-auto w-full">

        <!-- Top 5 Ganadores y Perdedores -->
        <div x-show="searchQuery === '' && !selectedCategory && currentFilter !== 'companies'" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
            <div class="card-bg border border-green-900/40 rounded-2xl p-5 shadow-lg">
                <div class="flex items-center justify-between mb-4 border-b border-neutral-800 pb-2.5">
                    <h2 class="serif-font text-lg font-bold text-green-400 flex items-center gap-2">
                        <span>🔥</span> <span x-text="t('topGainersTitle')"></span>
                    </h2>
                    <span class="text-[11px] text-neutral-400 uppercase tracking-wider" x-text="t('lastCycleTag')"></span>
                </div>
                <div class="space-y-2.5">
                    <template x-for="(gainer, idx) in top5Gainers" :key="'g-' + gainer.id">
                        <div @click="openProfile(gainer)" class="flex items-center justify-between bg-black/40 hover:bg-neutral-800/80 p-2.5 rounded-xl cursor-pointer transition border border-neutral-800/60">
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-bold text-green-400 w-4" x-text="'#' + (idx + 1)"></span>
                                <div class="relative">
                                    <img :src="gainer.img" class="w-9 h-9 rounded-lg object-cover bg-black" alt="Avatar">
                                    <template x-if="isUserOnline(gainer.name)">
                                        <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-green-500 ring-1 ring-black"></span>
                                    </template>
                                </div>
                                <div>
                                    <div class="text-sm font-semibold text-white flex items-center gap-1.5 flex-wrap">
                                        <span x-text="gainer.name"></span>
                                        <template x-if="isTrillionaire(gainer)">
                                            <span class="trillionaire-badge text-[9px] px-1.5 py-0.5 rounded uppercase" x-text="getTrillionaireLabel(gainer)"></span>
                                        </template>
                                        <template x-if="hasFire(gainer)">
                                            <span :class="getFireBadgeClass(gainer)" class="fire-badge text-xs" :title="getFireLabel(gainer)">🔥</span>
                                        </template>
                                    </div>
                                    <div class="text-[11px] text-neutral-400" x-text="formatWorth(gainer.netWorthValue)"></div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-xs font-bold text-green-400" x-text="formatDailyChange(gainer)"></div>
                                <div class="text-[10px] text-neutral-500" x-text="gainer.source"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div class="card-bg border border-red-900/40 rounded-2xl p-5 shadow-lg">
                <div class="flex items-center justify-between mb-4 border-b border-neutral-800 pb-2.5">
                    <h2 class="serif-font text-lg font-bold text-red-400 flex items-center gap-2">
                        <span>🩸</span> <span x-text="t('topLosersTitle')"></span>
                    </h2>
                    <span class="text-[11px] text-neutral-400 uppercase tracking-wider" x-text="t('lastCycleTag')"></span>
                </div>
                <div class="space-y-2.5">
                    <template x-for="(loser, idx) in top5Losers" :key="'l-' + loser.id">
                        <div @click="openProfile(loser)" class="flex items-center justify-between bg-black/40 hover:bg-neutral-800/80 p-2.5 rounded-xl cursor-pointer transition border border-neutral-800/60">
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-bold text-red-400 w-4" x-text="'#' + (idx + 1)"></span>
                                <div class="relative">
                                    <img :src="loser.img" class="w-9 h-9 rounded-lg object-cover bg-black" alt="Avatar">
                                    <template x-if="isUserOnline(loser.name)">
                                        <span class="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-green-500 ring-1 ring-black"></span>
                                    </template>
                                </div>
                                <div>
                                    <div class="text-sm font-semibold text-white flex items-center gap-1.5 flex-wrap">
                                        <span x-text="loser.name"></span>
                                        <template x-if="isTrillionaire(loser)">
                                            <span class="trillionaire-badge text-[9px] px-1.5 py-0.5 rounded uppercase" x-text="getTrillionaireLabel(loser)"></span>
                                        </template>
                                        <template x-if="isBloodActive(loser)">
                                            <span class="blood-badge text-xs">🩸</span>
                                        </template>
                                    </div>
                                    <div class="text-[11px] text-neutral-400" x-text="formatWorth(loser.netWorthValue)"></div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-xs font-bold text-red-400" x-text="formatDailyChange(loser)"></div>
                                <div class="text-[10px] text-neutral-500" x-text="loser.source"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
        
        <!-- Vista Top 5 con Gráfica -->
        <div x-show="currentFilter === 'top5' && searchQuery === ''" class="grid grid-cols-1 md:grid-cols-12 gap-8 mb-12">
            <div class="md:col-span-4 space-y-3">
                <template x-for="person in top5People" :key="person.id">
                    <div @click="selectedTop5Person = person" :class="[selectedTop5Person?.id === person.id ? 'active-card' : 'card-bg', getContainerGlowClass(person)]" class="p-4 rounded-xl cursor-pointer hover:bg-neutral-800 transition relative">
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2 flex-wrap">
                                <div class="serif-font text-lg font-bold" x-text="person.id + '. ' + person.name"></div>
                                <template x-if="isTrillionaire(person)">
                                    <span class="trillionaire-badge text-[9px] px-1.5 py-0.5 rounded uppercase" x-text="getTrillionaireLabel(person)"></span>
                                </template>
                            </div>
                            <template x-if="isBloodActive(person)">
                                <span class="blood-badge text-base" title="Losing capital">🩸</span>
                            </template>
                            <template x-if="!isBloodActive(person) && hasFire(person)">
                                <span :class="getFireBadgeClass(person)" class="fire-badge text-base" :title="getFireLabel(person)">🔥</span>
                            </template>
                        </div>
                        <div class="text-xs text-neutral-400 mt-0.5" x-text="person.source"></div>
                        <div class="flex items-center justify-between mt-1">
                            <div class="text-sm font-semibold" x-text="formatWorth(person.netWorthValue)"></div>
                            <div x-show="hasDailyChange(person)" :class="person.positive ? 'text-green-400' : 'text-red-400'" class="text-xs font-semibold" x-text="formatDailyChange(person)"></div>
                        </div>
                    </div>
                </template>
            </div>

            <div :class="getContainerGlowClass(selectedTop5Person)" class="md:col-span-8 bg-[#121212] p-8 rounded-2xl border border-neutral-800/90 flex flex-col justify-between shadow-2xl" x-data="{ top5Tab: 'wealth' }">
                <div>
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center gap-4">
                            <div class="relative">
                                <img :src="selectedTop5Person?.img" class="w-16 h-16 rounded-xl object-cover bg-black" alt="Avatar">
                                <template x-if="isUserOnline(selectedTop5Person?.name)">
                                    <span class="absolute -bottom-0.5 -right-0.5 w-4 h-4 rounded-full bg-green-500 ring-2 ring-black" title="Online"></span>
                                </template>
                                <template x-if="isBloodActive(selectedTop5Person)">
                                    <span class="blood-badge absolute -top-2 -right-2 text-xl" title="Losing capital">🩸</span>
                                </template>
                                <template x-if="!isBloodActive(selectedTop5Person) && hasFire(selectedTop5Person)">
                                    <span :class="getFireBadgeClass(selectedTop5Person)" class="fire-badge absolute -top-2 -right-2 text-xl" :title="getFireLabel(selectedTop5Person)">🔥</span>
                                </template>
                            </div>
                            <div>
                                <div class="flex items-center gap-2.5 flex-wrap">
                                    <h2 class="serif-font text-2xl md:text-3xl font-bold" x-text="selectedTop5Person?.id + '. ' + selectedTop5Person?.name"></h2>
                                    <template x-if="isTrillionaire(selectedTop5Person)">
                                        <span class="trillionaire-badge text-[10px] px-2 py-0.5 rounded-md uppercase" x-text="'👑 ' + getTrillionaireLabel(selectedTop5Person)"></span>
                                    </template>
                                </div>
                                <div class="text-xs text-neutral-400 mt-1" x-text="'Peak Net Worth: ' + formatWorth(selectedTop5Person?.peakNetWorth || selectedTop5Person?.netWorthValue) + ' • Peak Rank: #' + (selectedTop5Person?.peakRank || selectedTop5Person?.id)"></div>
                                <div x-show="isBloodActive(selectedTop5Person)" class="text-xs font-semibold tracking-wider uppercase mt-1 text-red-500" x-text="t('bloodMarketLabel')"></div>
                                <div x-show="!isBloodActive(selectedTop5Person) && hasFire(selectedTop5Person)" class="text-xs font-semibold tracking-wider uppercase mt-1 text-neutral-300" x-text="'🔥 ' + getFireLabel(selectedTop5Person)"></div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <template x-if="currentUser && currentUser.name.toLowerCase() === selectedTop5Person?.name.toLowerCase()">
                                <button @click="openBioEditor(selectedTop5Person)" class="bg-neutral-800 hover:bg-neutral-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5" x-text="t('editBioBtn')"></button>
                            </template>
                        </div>
                    </div>

                    <div class="inline-flex bg-[#1c1c1c] p-1 rounded-full mb-7 border border-neutral-800/80">
                        <button @click="top5Tab = 'wealth'" :class="top5Tab === 'wealth' ? 'bg-[#2c2c2c] text-white font-semibold shadow-sm' : 'text-neutral-400 hover:text-white'" class="px-5 py-1.5 rounded-full text-xs md:text-sm transition" x-text="t('wealthHistory')"></button>
                        <button @click="top5Tab = 'biography'" :class="top5Tab === 'biography' ? 'bg-[#2c2c2c] text-white font-semibold shadow-sm' : 'text-neutral-400 hover:text-white'" class="px-5 py-1.5 rounded-full text-xs md:text-sm transition" x-text="t('biography')"></button>

            let h = 2166136261 >>> 0;

            }
            h += h << 13;
            h ^= h >>> 7;
            h += h << 3;
            h ^= h >>> 17;
            h += h << 5;

                editCompanyLogoInput: '',
                tempBioText: '',
                tempSource: 'Tycoons',
                newCompanyName: '',
                newCompanySector: 'Technology & AI',
                newCompanyInvestment: 15.0,
                newCompanyLogo: '',
                inviteUsernameInput: '',
                presetCompanyLogos: PRESET_COMPANY_LOGOS,
                allSectors: AVAILABLE_SECTORS,
                searchQuery: '',
                regUsername: '',
                regPassword: '',
                isRegistering: false,
                currentUser: null,
                people: [],
                companies: [],
                registeredUsers: [],
                onlineUsersMap: {},
                userPasswordsMap: {},
                firstTrillionaireName: null,
                lastSimulatedCycle: 0,
                nextUpdateTimestamp: 0,
                timeRemainingMs: TWELVE_HOURS_MS,
                timerInterval: null,
                toastMessage: '',
                toastIcon: '✨',
                toastTimeout: null,
                notify(msg, icon = '✨') {
                    this.toastMessage = msg;
                    this.toastIcon = icon;
                    if (this.toastTimeout) clearTimeout(this.toastTimeout);
                    this.toastTimeout = setTimeout(() => {
                        this.toastMessage = '';
                    }, 4000);
                },
                t(key) {
                    return translations[this.lang]?.[key] || translations['en'][key] || key;
                },
                get formattedCountdown() {
                    let totalSeconds = Math.max(0, Math.floor(this.timeRemainingMs / 1000));
                    let hours = Math.floor(totalSeconds / 3600);
                    let minutes = Math.floor((totalSeconds % 3600) / 60);
                    let seconds = totalSeconds % 60;
                    const pad = (n) => String(n).padStart(2, '0');
                    return `${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s`;
                },
                get top5Gainers() {
                    return [...this.people].filter(p => p.changeVal > 0).sort((a, b) => b.changeVal - a.changeVal).slice(0, 5);
                },
                get top5Losers() {
                    return [...this.people].filter(p => p.changeVal < 0).sort((a, b) => a.changeVal - b.changeVal).slice(0, 5);
                },
                changeLanguage(newLang) {
                    this.lang = newLang;
                    localStorage.setItem('empire_lang', newLang);
                },
                resetViews(filterName) {
                    this.currentFilter = filterName;
                    this.selectedCategory = null;
                    this.selectedPerson = null;
                    this.selectedCompany = null;
                    this.showCategoriesDropdown = false;
                    this.searchQuery = '';
                },
                formatWorth(val) {
                    if (val === undefined || val === null) return '$0B';
                    if (val >= 1000) {
                        let trillions = val / 1000;
                        return '$' + trillions.toFixed(1) + 'T';
                    }
                    return val % 1 === 0 ? '$' + val.toFixed(0) + 'B' : '$' + val.toFixed(1) + 'B';
                },
                isTrillionaire(item) {
                    return item && item.netWorthValue >= 1000;
                },
                getTrillionaireLabel(item) {
                    if (!this.isTrillionaire(item)) return '';
                    if (this.firstTrillionaireName && item.name && item.name.toLowerCase() === this.firstTrillionaireName.toLowerCase()) {
                        return this.t('firstTrillionaire');
                    }
                    return '';
                },
                hasDailyChange(item) {
                    return item && item.changeVal !== undefined && item.changeVal !== 0;
                },
                formatDailyChange(item) {
                    if (!this.hasDailyChange(item)) return '▲ +$0B (0.0%)';
                    let prevWorth = item.netWorthValue - item.changeVal;
                    let percentage = prevWorth > 0 ? (item.changeVal / prevWorth) * 100 : 0;
                    let sign = item.changeVal > 0 ? '+' : '-';
                    let absChange = Math.abs(item.changeVal);
                    let valStr = '';
                    if (absChange >= 1000) {
                        valStr = `$${(absChange / 1000).toFixed(1)}T`;
                    } else if (absChange >= 1) {
                        valStr = `$${absChange.toFixed(1)}B`;
                    } else {
                        valStr = `$${(absChange * 1000).toFixed(0)}M`;
                    }
                    let symbol = item.changeVal > 0 ? '▲' : '▼';
                    let pctSign = percentage >= 0 ? '+' : '';
                    return `${symbol} ${sign}${valStr} (${pctSign}${percentage.toFixed(1)}%)`;
                },
                isBloodActive(item) {
                    return item && item.changeVal !== undefined && item.changeVal <= -1.0;
                },
                getFireTier(item) {
                    if (!item || item.changeVal === undefined || item.changeVal < 1.0) return 0;
                    const gain = item.changeVal;
                    if (gain >= 40) return 40;
                    if (gain >= 30) return 30;
                    if (gain >= 20) return 20;
                    if (gain >= 15) return 15;
                    if (gain >= 10) return 10;
                    if (gain >= 5) return 5;
                    return 1;
                },
                hasFire(item) {
                    return this.getFireTier(item) > 0;
                },
                getFireBadgeClass(item) {
                    const tier = this.getFireTier(item);
                    return tier > 0 ? `fire-tier-${tier}` : '';
                },
                getContainerGlowClass(item) {
                    if (this.isBloodActive(item)) return 'blood-glow';
                    const tier = this.getFireTier(item);
                    return tier > 0 ? `glow-tier-${tier}` : '';
                },
                getFireLabel(item) {
                    const tier = this.getFireTier(item);
                    return tier > 0 ? this.t(`fire${tier}`) : '';
                },
                getChartData(item) {
                    if (!item) return { pointsStr: '10,85 440,85', lastX: 440, lastY: 85 };
                    let vals = (item.history && item.history.length >= 2) ? [...item.history] : [item.netWorthValue - (item.changeVal || 0), item.netWorthValue];
                    
                    while (vals.length < 24) {
                        let first = vals[0];
                        let r = deterministicRandom(`${item.name || 'item'}_pad_${vals.length}`);
                        let step = (r - 0.5) * (first * 0.04);
                        vals.unshift(Math.max(5, Number((first - step).toFixed(2))));
                    }

                    let minV = Math.min(...vals);
                    let maxV = Math.max(...vals);
                    let range = maxV - minV;
                    if (range < 0.01) range = 1;

                    const width = 445;
                    const startX = 10;
                    const topPad = 18;
                    const bottomPad = 155;
                    const usableH = bottomPad - topPad;

                    let coords = vals.map((v, idx) => {
                        let x = startX + (idx / (vals.length - 1)) * (width - startX);
                        let norm = (v - minV) / range;
                        let y = bottomPad - norm * usableH;
                        return { x: Number(x.toFixed(1)), y: Number(y.toFixed(1)) };
                    });

                    let pointsStr = coords.map(c => `${c.x},${c.y}`).join(' ');
                    let last = coords[coords.length - 1];
                    return { pointsStr, lastX: last.x, lastY: last.y };
                },
                get top5People() {
                    return this.people.slice(0, 5);
                },
                get uniqueCategories() {
                    let combined = new Set([...AVAILABLE_SECTORS, ...this.people.map(p => p.source)]);
                    return Array.from(combined).sort();
                },
                get displayedPeople() {
                    if (this.currentFilter === 'companies') {
                        let list = [...this.companies].sort((a, b) => b.netWorthValue - a.netWorthValue);
                        if (this.searchQuery && this.searchQuery.trim() !== '') {
                            let q = this.searchQuery.toLowerCase();
                            list = list.filter(c => c.name.toLowerCase().includes(q) || c.ceo.toLowerCase().includes(q));
                        }
                        return list;
                    }

                    let list = this.people;
                    if (this.searchQuery && this.searchQuery.trim() !== '') {
                        let q = this.searchQuery.toLowerCase();
                        list = list.filter(p => p.name.toLowerCase().includes(q));
                    } else {
                        if (this.currentFilter === 'women') {
                            list = list.filter(p => p.gender === 'Women');
                        } else if (this.selectedCategory) {
                            list = list.filter(p => p.source === this.selectedCategory);
                        }
                    }
                    return list.sort((a, b) => b.netWorthValue - a.netWorthValue);
                },
                get userOwnedCompanies() {
                    if (!this.currentUser) return [];
                    return this.companies.filter(c => c.ceo.toLowerCase() === this.currentUser.name.toLowerCase());
                },
                get pendingInvitesForCurrentUser() {
                    if (!this.currentUser) return [];
                    const uName = this.currentUser.name.toLowerCase();
                    return this.companies.filter(c => c.pendingInvites && c.pendingInvites.some(i => i.toLowerCase() === uName));
                },
                isUserOnline(username) {
                    if (!username) return false;
                    if (this.currentUser && this.currentUser.name.toLowerCase() === username.toLowerCase()) return true;
                    return !!this.onlineUsersMap[username.toLowerCase()];
                },
                openProfile(person) {
                    this.selectedPerson = person;
                    this.selectedCompany = null;
                },
                openCompanyDashboard(company) {
                    this.selectedCompany = company;
                    this.selectedPerson = null;
                },
                openBioEditor(person) {
                    if (!person) person = this.currentUser;
                    if (!person) return;
                    this.tempBioText = person.bio ? person.bio.join('\n') : '';
                    this.tempSource = person.source || 'Tycoons';
                    this.showBioModal = true;
                },
                openCompanyModal(isAuto = false) {
                    if (!this.currentUser) {
                        this.showRegisterModal = true;
                        return;
                    }
                    this.isAutoCompanyPrompt = isAuto;
                    this.newCompanyName = '';
                    this.newCompanySector = 'Technology & AI';
                    this.newCompanyInvestment = 15.0;
                    this.newCompanyLogo = OMEGA_LOGO_SVG;
                    this.showCompanyModal = true;
                },
                loadCompaniesFromStorage() {
                    try {
                        let savedComps = localStorage.getItem('empire_user_companies');
                        if (savedComps) {
                            let parsed = JSON.parse(savedComps);
                            if (Array.isArray(parsed)) {
                                this.companies = parsed.sort((a, b) => b.netWorthValue - a.netWorthValue);
                            }
                        }
                    } catch (e) {}
                },
                saveCompaniesToStorage() {
                    try {
                        this.companies.sort((a, b) => b.netWorthValue - a.netWorthValue);
                        localStorage.setItem('empire_user_companies', JSON.stringify(this.companies));
                    } catch (e) {}
                },
                saveSocialToStorage() {
                    try {
                        localStorage.setItem('empire_real_registered_users', JSON.stringify(this.registeredUsers));
                        localStorage.setItem('empire_online_users', JSON.stringify(this.onlineUsersMap));
                        localStorage.setItem('empire_user_passwords', JSON.stringify(this.userPasswordsMap));
                    } catch (e) {}
                },
                registerRealUserRecord(userObj) {
                    if (!userObj || !userObj.name) return;
                    const idx = this.registeredUsers.findIndex(u => u.name.toLowerCase() === userObj.name.toLowerCase());
                    const record = { name: userObj.name, img: userObj.img, lastSeen: Date.now() };
                    if (idx >= 0) {
                        this.registeredUsers[idx] = record;
                    } else {
                        this.registeredUsers.push(record);
                    }
                    this.onlineUsersMap[userObj.name.toLowerCase()] = true;
                    this.saveSocialToStorage();
                },
                saveUserBio() {
                    if (!this.currentUser) return;
                    let lines = this.tempBioText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                    if (lines.length === 0) lines = ["No biography provided yet."];
                    
                    this.currentUser.bio = lines;
                    this.currentUser.source = this.tempSource;
                    
                    let found = this.people.find(p => p.name.toLowerCase() === this.currentUser.name.toLowerCase());
                    if (found) {
                        found.bio = lines;
                        found.source = this.tempSource;
                    }
                    
                    try {
                        localStorage.setItem('empire_current_user', JSON.stringify(this.currentUser));
                    } catch (e) {}
                    
                    this.showBioModal = false;
                    this.notify('Profile and sector updated!', '✅');
                },
                logoutUser() {
                    if (this.currentUser) {
                        delete this.onlineUsersMap[this.currentUser.name.toLowerCase()];
                        this.saveSocialToStorage();
                    }
                    this.currentUser = null;
                    this.selectedCompany = null;
                    localStorage.removeItem('empire_current_user');
                    this.notify('You have logged out successfully.', '🚪');
                },
                syncGlobalMarketToCycle(targetCycle) {
                    let syncedPeople = getBasePeople();

                    try {
                        this.loadCompaniesFromStorage();
                    } catch (e) {}

                    syncedPeople.forEach(p => {
                        p.history = [p.netWorthValue];
                        if (!p.peakNetWorth) p.peakNetWorth = p.netWorthValue;
                        if (!p.peakRank) p.peakRank = p.id;
                    });
                    this.companies.forEach(c => {
                        if (!c.history || c.history.length === 0) c.history = [c.netWorthValue];
                    });

                    const startCycle = Math.max(1, targetCycle - 32);

                    for (let cycle = startCycle; cycle <= targetCycle; cycle++) {
                        this.companies.forEach(company => {
                            let r1 = deterministicRandom(`comp_${company.name.toLowerCase()}_c${cycle}_a`);
                            let r2 = deterministicRandom(`comp_${company.name.toLowerCase()}_c${cycle}_b`);
                            
                            let levelBonus = ((company.level || 1) - 1) * 0.008;
                            let pctChange = 0;

                            if (r1 < 0.22) {
                                pctChange = levelBonus * 0.5;
                            } else if (r1 < 0.72) {
                                pctChange = 0.005 + r2 * 0.045 + levelBonus;
                            } else {
                                pctChange = -(0.005 + r2 * 0.032) + (levelBonus * 0.4);
                            }

                            let companyDelta = Number((company.netWorthValue * pctChange).toFixed(1));
                            if (Math.abs(companyDelta) < 0.1) companyDelta = 0;

                            company.netWorthValue = Math.max(5.0, Number((company.netWorthValue + companyDelta).toFixed(1)));
                            company.changeVal = companyDelta;
                            company.positive = companyDelta >= 0;
                            company.history.push(company.netWorthValue);
                        });

                        syncedPeople.forEach(person => {
                            let r1 = deterministicRandom(`pers_${person.name.toLowerCase()}_c${cycle}_a`);
                            let r2 = deterministicRandom(`pers_${person.name.toLowerCase()}_c${cycle}_b`);
                            let pctChange = 0;

                            if (r1 < 0.20) {
                                pctChange = 0;
                            } else if (r1 < 0.56) {
                                pctChange = 0.003 + r2 * 0.038;
                            } else if (r1 < 0.70) {
                                pctChange = 0.025 + r2 * 0.065;
                            } else {
                                pctChange = -(0.005 + r2 * 0.048);
                            }

                            let delta = Number((person.netWorthValue * pctChange).toFixed(1));
                            if (Math.abs(delta) < 0.1) delta = 0;

                            person.netWorthValue = Math.max(10.0, Number((person.netWorthValue + delta).toFixed(1)));
                            person.changeVal = delta;
                            person.positive = delta >= 0;
                            person.history.push(person.netWorthValue);

                            if (!person.peakNetWorth || person.netWorthValue > person.peakNetWorth) {
                                person.peakNetWorth = Number(person.netWorthValue.toFixed(1));
                            }
                        });

                        syncedPeople.sort((a, b) => b.netWorthValue - a.netWorthValue);
                        syncedPeople.forEach((p, idx) => {
                            p.id = idx + 1;
                            if (!p.peakRank || p.id < p.peakRank) {
                                p.peakRank = p.id;
                            }
                        });
                    }

                    this.companies.sort((a, b) => b.netWorthValue - a.netWorthValue);
                    this.saveCompaniesToStorage();

                    this.people = syncedPeople;
                    this.lastSimulatedCycle = targetCycle;

                    if (this.selectedTop5Person) {
                        let updatedTop = this.people.find(p => p.name === this.selectedTop5Person.name);
                        this.selectedTop5Person = updatedTop || (this.people.length > 0 ? this.people[0] : null);
                    } else if (this.people.length > 0) {
                        this.selectedTop5Person = this.people[0];
                    }

                    if (this.selectedPerson) {
                        let updatedSel = this.people.find(p => p.name === this.selectedPerson.name);
                        if (updatedSel) this.selectedPerson = updatedSel;
                    }

                    if (this.selectedCompany) {
                        let updatedComp = this.companies.find(c => c.name.toLowerCase() === this.selectedCompany.name.toLowerCase());
                        if (updatedComp) this.selectedCompany = updatedComp;
                    }
                },
                getCurrentGlobalCycle() {
                    const elapsed = Math.max(0, Date.now() - GLOBAL_EPOCH_MS);
                    return Math.floor(elapsed / TWELVE_HOURS_MS);
                },
                startCountdownLoop() {
                    if (this.timerInterval) clearInterval(this.timerInterval);
                    this.timerInterval = setInterval(() => {
                        let now = Date.now();
                        let currentCycle = this.getCurrentGlobalCycle();
                        let nextCycleStart = GLOBAL_EPOCH_MS + (currentCycle + 1) * TWELVE_HOURS_MS;
                        
                        this.nextUpdateTimestamp = nextCycleStart;
                        this.timeRemainingMs = Math.max(0, nextCycleStart - now);

                        if (currentCycle > this.lastSimulatedCycle) {
                            this.syncGlobalMarketToCycle(currentCycle);
                        }
                    }, 1000);
                },
                async refreshRobloxProfile(userObj) {
                    try {
                        let userRes = await fetch(`https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(userObj.name)}&limit=5`);
                        let userData = await userRes.json();
                        if (userData.data && userData.data.length > 0) {
                            let matchedUser = userData.data.find(u => u.name.toLowerCase() === userObj.name.toLowerCase()) || userData.data[0];
                            let userId = matchedUser.id;
                            let thumbRes = await fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=false`);
                            let thumbData = await thumbRes.json();
                            if (thumbData.data && thumbData.data.length > 0 && thumbData.data[0].imageUrl) {
                                userObj.img = thumbData.data[0].imageUrl;
                                userObj.name = matchedUser.name;
                            }
                        }
                    } catch (e) {}
                },
                async initEmpire() {
                    let savedLang = localStorage.getItem('empire_lang');
                    if (savedLang && translations[savedLang]) {
                        this.lang = savedLang;
                    } else {
                        this.lang = 'en';
                    }

                    try {
                        let savedRegUsers = localStorage.getItem('empire_real_registered_users');
                        if (savedRegUsers) {
                            this.registeredUsers = JSON.parse(savedRegUsers) || [];
                        }
                    } catch (e) {}

                    try {
                        let savedOnline = localStorage.getItem('empire_online_users');
                        if (savedOnline) {
                            this.onlineUsersMap = JSON.parse(savedOnline) || {};
                        }
                    } catch (e) {}

                    try {
                        let savedPassMap = localStorage.getItem('empire_user_passwords');
                        if (savedPassMap) {
                            this.userPasswordsMap = JSON.parse(savedPassMap) || {};
                        }
                    } catch (e) {}

                    try {
                        let savedUser = localStorage.getItem('empire_current_user');
                        if (savedUser) {
                            this.currentUser = JSON.parse(savedUser);
                            await this.refreshRobloxProfile(this.currentUser);
                            this.registerRealUserRecord(this.currentUser);
                            localStorage.setItem('empire_current_user', JSON.stringify(this.currentUser));
                        }
                    } catch(e) {
                        localStorage.removeItem('empire_current_user');
                    }

                    this.loadCompaniesFromStorage();

                    let currentCycle = this.getCurrentGlobalCycle();
                    let nextCycleStart = GLOBAL_EPOCH_MS + (currentCycle + 1) * TWELVE_HOURS_MS;
                    this.nextUpdateTimestamp = nextCycleStart;
                    this.timeRemainingMs = Math.max(0, nextCycleStart - Date.now());

                    this.syncGlobalMarketToCycle(currentCycle);
                    this.startCountdownLoop();

                    window.addEventListener('storage', (e) => {
                        if (e.key === 'empire_user_companies' && e.newValue) {
                            try { this.companies = JSON.parse(e.newValue) || []; } catch (err) {}
                        }
                    });
                }
            }
        }
    </script>
