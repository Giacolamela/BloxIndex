BloxIndex
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BloxIndex</title>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Georgia:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');
        
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .serif-font {
            font-family: 'Georgia', serif;
        }
        .card-bg {
            background-color: #181818;
        }
        .active-card {
            background-color: #242424;
            border-left: 3px solid #3b82f6;
        }

        @keyframes flicker {
            0%, 100% { transform: scale(1) rotate(-2deg); opacity: 0.92; }
            50% { transform: scale(1.18) rotate(2deg); opacity: 1; }
        }
        @keyframes purplePulse {
            0%, 100% { filter: hue-rotate(265deg) saturate(2.2) drop-shadow(0 0 14px #a855f7); transform: scale(1.08) rotate(-3deg); }
            50% { filter: hue-rotate(280deg) saturate(2.6) drop-shadow(0 0 24px #c084fc); transform: scale(1.26) rotate(3deg); }
        }
        @keyframes drip {
            0% { transform: translateY(-3px); opacity: 0.8; filter: drop-shadow(0 0 6px #dc2626); }
            50% { transform: translateY(4px); opacity: 1; filter: drop-shadow(0 0 10px #991b1b); }
            100% { transform: translateY(-3px); opacity: 0.8; filter: drop-shadow(0 0 6px #dc2626); }
        }
        @keyframes goldShine {
            0%, 100% { box-shadow: 0 0 8px rgba(250, 204, 21, 0.5); }
            50% { box-shadow: 0 0 16px rgba(250, 204, 21, 0.9); }
        }

        .fire-badge {
            display: inline-block;
            animation: flicker 1.3s infinite ease-in-out;
        }
        .blood-badge {
            display: inline-block;
            animation: drip 1.2s infinite ease-in-out;
        }
        .trillionaire-badge {
            background: linear-gradient(90deg, #f59e0b, #fde047, #d97706);
            color: #000000;
            font-weight: 800;
            letter-spacing: 0.05em;
            animation: goldShine 2s infinite ease-in-out;
        }

        .fire-tier-1 { filter: drop-shadow(0 0 7px #fb923c) brightness(1.1); }
        .glow-tier-1 { box-shadow: 0 0 14px rgba(251, 146, 60, 0.28); border: 1px solid rgba(251, 146, 60, 0.45); }
        .fire-tier-5 { filter: saturate(1.6) drop-shadow(0 0 11px #f97316); }
        .glow-tier-5 { box-shadow: 0 0 20px rgba(249, 115, 22, 0.4); border: 1px solid rgba(249, 115, 22, 0.65); }
        .fire-tier-10 { filter: hue-rotate(28deg) brightness(1.35) drop-shadow(0 0 13px #facc15); }
        .glow-tier-10 { box-shadow: 0 0 22px rgba(250, 204, 21, 0.45); border: 1px solid rgba(250, 204, 21, 0.75); }
        .fire-tier-15 { filter: hue-rotate(-25deg) saturate(2) drop-shadow(0 0 14px #ef4444); }
        .glow-tier-15 { box-shadow: 0 0 25px rgba(239, 68, 68, 0.5); border: 1px solid rgba(239, 68, 68, 0.8); }
        .fire-tier-20 { filter: hue-rotate(95deg) saturate(1.8) drop-shadow(0 0 14px #22c55e); }
        .glow-tier-20 { box-shadow: 0 0 25px rgba(34, 197, 94, 0.5); border: 1px solid rgba(34, 197, 94, 0.8); }
        .fire-tier-30 { filter: hue-rotate(195deg) saturate(2) drop-shadow(0 0 16px #3b82f6); }
        .glow-tier-30 { box-shadow: 0 0 28px rgba(59, 130, 246, 0.55); border: 1px solid rgba(59, 130, 246, 0.85); }
        .fire-tier-40 { animation: purplePulse 1.5s infinite ease-in-out; }
        .glow-tier-40 { box-shadow: 0 0 32px rgba(168, 85, 247, 0.65), inset 0 0 16px rgba(168, 85, 247, 0.25); border: 1px solid #a855f7; }
        .blood-glow { box-shadow: 0 0 22px rgba(220, 38, 38, 0.4); border: 1px solid rgba(220, 38, 38, 0.7); }
    </style>
</head>
<body x-data="empireApp()" x-init="initEmpire()" class="min-h-screen px-6 py-4 flex flex-col">

    <!-- Título Principal -->
    <div class="max-w-7xl mx-auto w-full pt-4 pb-2 text-center">
        <h1 class="serif-font text-4xl md:text-5xl font-bold tracking-tight uppercase">
            <span class="fire-badge fire-tier-5 mr-2">🔥</span><span x-text="t('title')"></span><span class="fire-badge fire-tier-5 ml-2">🔥</span>
        </h1>
        
        <div class="mt-3 inline-flex items-center gap-2.5 bg-[#141414] border border-neutral-800 px-4 py-1.5 rounded-full text-xs text-neutral-300 shadow-lg">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            <span x-text="t('nextUpdateLabel')"></span>
            <span class="font-mono font-bold text-white tracking-wider" x-text="formattedCountdown"></span>
        </div>
    </div>

    <!-- Barra Superior de Navegación -->
    <header class="flex flex-col md:flex-row items-center justify-between text-sm font-medium border-b border-neutral-800 pb-3 mb-8 max-w-7xl mx-auto w-full gap-4 mt-4">
        <div class="flex items-center space-x-6 flex-wrap">
            <button @click="currentFilter = 'top5'; selectedCategory = null; selectedPerson = null; selectedCompanyView = null; showCategoriesDropdown = false; searchQuery = ''" :class="currentFilter === 'top5' && !selectedPerson && !selectedCompanyView ? 'text-white border-b-2 border-white pb-1' : 'text-neutral-400 hover:text-white'" x-text="t('top5')"></button>
            <button @click="currentFilter = 'all'; selectedCategory = null; selectedPerson = null; selectedCompanyView = null; showCategoriesDropdown = false; searchQuery = ''" :class="currentFilter === 'all' && !selectedCategory && !selectedPerson && !selectedCompanyView ? 'text-white border-b-2 border-white pb-1' : 'text-neutral-400 hover:text-white'" x-text="t('top')"></button>
            <button @click="currentFilter = 'women'; selectedCategory = null; selectedPerson = null; selectedCompanyView = null; showCategoriesDropdown = false; searchQuery = ''" :class="currentFilter === 'women' && !selectedPerson && !selectedCompanyView ? 'text-white border-b-2 border-white pb-1' : 'text-neutral-400 hover:text-white'" x-text="t('women')"></button>
            <button @click="currentFilter = 'companies'; selectedCategory = null; selectedPerson = null; selectedCompanyView = null; showCategoriesDropdown = false; searchQuery = ''" :class="currentFilter === 'companies' && !selectedPerson && !selectedCompanyView ? 'text-white border-b-2 border-white pb-1' : 'text-neutral-400 hover:text-white'" x-text="t('companiesTab')"></button>
            
            <div class="relative" @click.away="showCategoriesDropdown = false">
                <button @click="showCategoriesDropdown = !showCategoriesDropdown; currentFilter = 'categories'" :class="selectedCategory || showCategoriesDropdown ? 'text-white border-b-2 border-white pb-1' : 'text-neutral-400 hover:text-white'" class="flex items-center gap-1">
                    <span x-text="t('categories')"></span> <span class="text-xs">▾</span>
                </button>

                <div x-show="showCategoriesDropdown" class="absolute left-0 mt-2 w-64 card-bg border border-neutral-800 rounded-xl shadow-2xl py-2 z-50" style="display: none;">
                    <template x-for="cat in uniqueCategories" :key="cat">
                        <button @click="selectedCategory = cat; showCategoriesDropdown = false; currentFilter = 'categories'; selectedCompanyView = null;" class="w-full text-left px-4 py-2.5 text-sm hover:bg-neutral-800 text-neutral-300 hover:text-white transition flex items-center justify-between">
                            <span x-text="cat"></span>
                            <span class="text-xs text-neutral-500" x-text="people.filter(p => p.source === cat).length"></span>
                        </button>
                    </template>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-3 w-full md:w-auto justify-end flex-wrap">
            <div class="relative">
                <select x-model="lang" @change="changeLanguage(lang)" class="bg-[#181818] border border-neutral-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-neutral-600 cursor-pointer">
                    <option value="en">🇬🇧 English</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="it">🇮🇹 Italiano</option>
                    <option value="pt">🇵🇹 Português</option>
                    <option value="de">🇩🇪 Deutsch</option>
                </select>
            </div>

            <div class="relative w-full md:w-48">
                <input type="text" x-model="searchQuery" :placeholder="t('searchPlaceholder')" class="w-full bg-[#181818] border border-neutral-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-neutral-600">
            </div>

            <template x-if="!currentUser">
                <button @click="showRegisterModal = true" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-lg text-xs font-semibold transition whitespace-nowrap" x-text="t('registerLogin')"></button>
            </template>

            <template x-if="currentUser">
                <div class="relative" @click.away="showUserMenu = false">
                    <div @click="showUserMenu = !showUserMenu" class="flex items-center gap-2 bg-neutral-900 border border-neutral-800 px-3 py-1.5 rounded-lg cursor-pointer hover:bg-neutral-800 transition">
                        <img :src="currentUser.img" class="w-6 h-6 rounded-full object-cover bg-black" alt="Avatar">
                        <span class="text-xs font-medium text-white" x-text="currentUser.name"></span>
                        <span class="text-xs text-neutral-400">▾</span>
                    </div>

                    <div x-show="showUserMenu" class="absolute right-0 mt-2 w-52 card-bg border border-neutral-800 rounded-xl shadow-2xl py-2 z-50" style="display: none;">
                        <button @click="openProfile(currentUser); showUserMenu = false" class="w-full text-left px-4 py-2 text-xs hover:bg-neutral-800 text-neutral-300 hover:text-white transition flex items-center gap-2">
                            👤 <span x-text="t('myProfile')"></span>
                        </button>
                        <button @click="openBioEditor(currentUser); showUserMenu = false" class="w-full text-left px-4 py-2 text-xs hover:bg-neutral-800 text-neutral-300 hover:text-white transition flex items-center gap-2">
                            ✏️ <span x-text="t('editBio')"></span>
                        </button>
                        <button @click="openCompanyModal(); showUserMenu = false" class="w-full text-left px-4 py-2 text-xs hover:bg-neutral-800 text-blue-400 hover:text-blue-300 transition flex items-center gap-2">
                            🏢 <span x-text="getUserCompany() ? t('manageCompany') : t('createCompanyMenu')"></span>
                        </button>
                        <div class="border-t border-neutral-800 my-1"></div>
                        <button @click="logoutUser(); showUserMenu = false" class="w-full text-left px-4 py-2 text-xs hover:bg-neutral-800 text-red-400 transition flex items-center gap-2">
                            🚪 <span x-text="t('logout')"></span>
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main x-show="!selectedPerson && !selectedCompanyView" class="flex-grow max-w-7xl mx-auto w-full">

        <!-- Top 5 Ganadores y Perdedores -->
        <div x-show="searchQuery === '' && !selectedCategory && currentFilter !== 'companies'" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
            <div class="card-bg border border-green-900/40 rounded-2xl p-5 shadow-lg">
                <div class="flex items-center justify-between mb-4 border-b border-neutral-800 pb-2.5">
                    <h2 class="serif-font text-lg font-bold text-green-400 flex items-center gap-2">
                        <span>🔥</span> <span x-text="t('topGainersTitle')"></span>
                    </h2>
                    <span class="text-[11px] text-neutral-400 uppercase tracking-wider" x-text="t('lastCycleTag')"></span>
                </div>
                <div class="space-y-2.5">
                    <template x-for="(gainer, idx) in top5Gainers" :key="'g-' + gainer.id">
                        <div @click="openProfile(gainer)" class="flex items-center justify-between bg-black/40 hover:bg-neutral-800/80 p-2.5 rounded-xl cursor-pointer transition border border-neutral-800/60">
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-bold text-green-400 w-4" x-text="'#' + (idx + 1)"></span>
                                <img :src="gainer.img" class="w-9 h-9 rounded-lg object-cover bg-black" alt="Avatar">
                                <div>
                                    <div class="text-sm font-semibold text-white flex items-center gap-1.5 flex-wrap">
                                        <span x-text="gainer.name"></span>
                                        <template x-if="isTrillionaire(gainer)">
                                            <span class="trillionaire-badge text-[9px] px-1.5 py-0.5 rounded uppercase" x-text="getTrillionaireLabel(gainer)"></span>
                                        </template>
                                        <template x-if="hasFire(gainer)">
                                            <span :class="getFireBadgeClass(gainer)" class="fire-badge text-xs" :title="getFireLabel(gainer)">🔥</span>
                                        </template>
                                    </div>
                                    <div class="text-[11px] text-neutral-400" x-text="formatWorth(gainer.netWorthValue)"></div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-xs font-bold text-green-400" x-text="formatDailyChange(gainer)"></div>
                                <div class="text-[10px] text-neutral-500" x-text="gainer.source"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <div class="card-bg border border-red-900/40 rounded-2xl p-5 shadow-lg">
                <div class="flex items-center justify-between mb-4 border-b border-neutral-800 pb-2.5">
                    <h2 class="serif-font text-lg font-bold text-red-400 flex items-center gap-2">
                        <span>🩸</span> <span x-text="t('topLosersTitle')"></span>
                    </h2>
                    <span class="text-[11px] text-neutral-400 uppercase tracking-wider" x-text="t('lastCycleTag')"></span>
                </div>
                <div class="space-y-2.5">
                    <template x-for="(loser, idx) in top5Losers" :key="'l-' + loser.id">
                        <div @click="openProfile(loser)" class="flex items-center justify-between bg-black/40 hover:bg-neutral-800/80 p-2.5 rounded-xl cursor-pointer transition border border-neutral-800/60">
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-bold text-red-400 w-4" x-text="'#' + (idx + 1)"></span>
                                <img :src="loser.img" class="w-9 h-9 rounded-lg object-cover bg-black" alt="Avatar">
                                <div>
                                    <div class="text-sm font-semibold text-white flex items-center gap-1.5 flex-wrap">
                                        <span x-text="loser.name"></span>
                                        <template x-if="isTrillionaire(loser)">
                                            <span class="trillionaire-badge text-[9px] px-1.5 py-0.5 rounded uppercase" x-text="getTrillionaireLabel(loser)"></span>
                                        </template>
                                        <template x-if="isBloodActive(loser)">
                                            <span class="blood-badge text-xs">🩸</span>
                                        </template>
                                    </div>
                                    <div class="text-[11px] text-neutral-400" x-text="formatWorth(loser.netWorthValue)"></div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-xs font-bold text-red-400" x-text="formatDailyChange(loser)"></div>
                                <div class="text-[10px] text-neutral-500" x-text="loser.source"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
        
        <!-- Vista Top 5 con Gráfica Estilo Mercado Real -->
        <div x-show="currentFilter === 'top5' && searchQuery === ''" class="grid grid-cols-1 md:grid-cols-12 gap-8 mb-12">
            <div class="md:col-span-4 space-y-3">
                <template x-for="person in top5People" :key="person.id">
                    <div @click="selectedTop5Person = person" :class="[selectedTop5Person?.id === person.id ? 'active-card' : 'card-bg', getContainerGlowClass(person)]" class="p-4 rounded-xl cursor-pointer hover:bg-neutral-800 transition relative">
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2 flex-wrap">
                                <div class="serif-font text-lg font-bold" x-text="person.id + '. ' + person.name"></div>
                                <template x-if="isTrillionaire(person)">
                                    <span class="trillionaire-badge text-[9px] px-1.5 py-0.5 rounded uppercase" x-text="getTrillionaireLabel(person)"></span>
                                </template>
                            </div>
                            <template x-if="isBloodActive(person)">
                                <span class="blood-badge text-base" title="Perdiendo capital">🩸</span>
                            </template>
                            <template x-if="!isBloodActive(person) && hasFire(person)">
                                <span :class="getFireBadgeClass(person)" class="fire-badge text-base" :title="getFireLabel(person)">🔥</span>
                            </template>
                        </div>
                        <div class="text-xs text-neutral-400 mt-0.5" x-text="person.source"></div>
                        <div class="flex items-center justify-between mt-1">
                            <div class="text-sm font-semibold" x-text="formatWorth(person.netWorthValue)"></div>
                            <div x-show="hasDailyChange(person)" :class="person.positive ? 'text-green-400' : 'text-red-400'" class="text-xs font-semibold" x-text="formatDailyChange(person)"></div>
                        </div>
                    </div>
                </template>
            </div>

            <div :class="getContainerGlowClass(selectedTop5Person)" class="md:col-span-8 bg-[#121212] p-8 rounded-2xl border border-neutral-800/90 flex flex-col justify-between shadow-2xl" x-data="{ top5Tab: 'wealth' }">
                <div>
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center gap-4">
                            <div class="relative">
                                <img :src="selectedTop5Person?.img" class="w-16 h-16 rounded-xl object-cover bg-black" alt="Avatar">
                                <template x-if="isBloodActive(selectedTop5Person)">
                                    <span class="blood-badge absolute -top-2 -right-2 text-xl" title="Perdiendo capital">🩸</span>
                                </template>
                                <template x-if="!isBloodActive(selectedTop5Person) && hasFire(selectedTop5Person)">
                                    <span :class="getFireBadgeClass(selectedTop5Person)" class="fire-badge absolute -top-2 -right-2 text-xl" :title="getFireLabel(selectedTop5Person)">🔥</span>
                                </template>
                            </div>
                            <div>
                                <div class="flex items-center gap-2.5 flex-wrap">
                                    <h2 class="serif-font text-2xl md:text-3xl font-bold" x-text="selectedTop5Person?.id + '. ' + selectedTop5Person?.name"></h2>
                                    <template x-if="isTrillionaire(selectedTop5Person)">
                                        <span class="trillionaire-badge text-[10px] px-2 py-0.5 rounded-md uppercase" x-text="'👑 ' + getTrillionaireLabel(selectedTop5Person)"></span>
                                    </template>
                                </div>
                                <div x-show="isBloodActive(selectedTop5Person)" class="text-xs font-semibold tracking-wider uppercase mt-1 text-red-500" x-text="t('bloodMarketLabel')"></div>
                                <div x-show="!isBloodActive(selectedTop5Person) && hasFire(selectedTop5Person)" class="text-xs font-semibold tracking-wider uppercase mt-1 text-neutral-300" x-text="'🔥 ' + getFireLabel(selectedTop5Person)"></div>
                            </div>
                        </div>
                        <template x-if="currentUser && currentUser.name.toLowerCase() === selectedTop5Person?.name.toLowerCase()">
                            <button @click="openBioEditor(selectedTop5Person)" class="bg-neutral-800 hover:bg-neutral-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5" x-text="t('editBioBtn')"></button>
                        </template>
                    </div>

                    <!-- Pestañas Estilo Píldora -->
                    <div class="inline-flex bg-[#1c1c1c] p-1 rounded-full mb-7 border border-neutral-800/80">
                        <button @click="top5Tab = 'wealth'" :class="top5Tab === 'wealth' ? 'bg-[#2c2c2c] text-white font-semibold shadow-sm' : 'text-neutral-400 hover:text-white'" class="px-5 py-1.5 rounded-full text-xs md:text-sm transition" x-text="t('wealthHistory')"></button>
                        <button @click="top5Tab = 'biography'" :class="top5Tab === 'biography' ? 'bg-[#2c2c2c] text-white font-semibold shadow-sm' : 'text-neutral-400 hover:text-white'" class="px-5 py-1.5 rounded-full text-xs md:text-sm transition" x-text="t('biography')"></button>
                        <button @click="top5Tab = 'stats'" :class="top5Tab === 'stats' ? 'bg-[#2c2c2c] text-white font-semibold shadow-sm' : 'text-neutral-400 hover:text-white'" class="px-5 py-1.5 rounded-full text-xs md:text-sm transition" x-text="t('stats')"></button>
                    </div>

                    <!-- Contenido Pestaña Wealth History -->
                    <div x-show="top5Tab === 'wealth'">
                        <div class="text-[11px] font-bold text-neutral-400 tracking-wider uppercase mb-1" x-text="t('currentNetWorth')"></div>
                        <div class="text-5xl font-bold tracking-tight text-white mb-2" x-text="formatWorth(selectedTop5Person?.netWorthValue)"></div>
                        
                        <div class="flex items-center gap-2 text-sm font-semibold mb-7">
                            <span :class="selectedTop5Person?.positive ? 'text-green-400' : 'text-red-500'" x-text="formatDailyChange(selectedTop5Person)"></span>
                            <span class="text-xs font-normal text-neutral-400 uppercase tracking-wide" x-text="t('lastCycleTag')"></span>
                        </div>

                        <div class="mb-2 flex items-center justify-between">
                            <div>
                                <div class="text-xs font-bold text-neutral-300 uppercase tracking-wider" x-text="t('wealthHistory')"></div>
                                <div class="text-xs text-neutral-500 mt-0.5" x-text="t('chartSubLabel')"></div>
                            </div>
                            <span :class="selectedTop5Person?.positive ? 'bg-green-500/10 text-green-400 border-green-500/30' : 'bg-red-500/10 text-red-400 border-red-500/30'" class="text-[11px] font-bold px-2.5 py-1 rounded-full border uppercase tracking-wider" x-text="selectedTop5Person?.positive ? '▲ ' + t('gaining') : '▼ ' + t('dropping')"></span>
                        </div>

                        <!-- Gráfica Estilo Mercado Real con Color Dinámico -->
                        <div class="relative mt-2 pt-2">
                            <svg viewBox="0 0 460 175" class="w-full h-44 overflow-visible">
                                <defs>
                                    <radialGradient :id="'radial-glow-top5-' + selectedTop5Person?.id" cx="65%" cy="55%" r="50%">
                                        <stop offset="0%" :stop-color="selectedTop5Person?.positive ? '#22c55e' : '#ef4444'" stop-opacity="0.22"/>
                                        <stop offset="100%" :stop-color="selectedTop5Person?.positive ? '#22c55e' : '#ef4444'" stop-opacity="0"/>
                                    </radialGradient>
                                </defs>
                                <rect x="0" y="0" width="460" height="175" :fill="'url(#radial-glow-top5-' + selectedTop5Person?.id + ')'" rx="12"></rect>
                                
                                <polyline 
                                    :points="getChartData(selectedTop5Person).pointsStr" 
                                    fill="none" 
                                    :stroke="selectedTop5Person?.positive ? '#22c55e' : '#ef4444'" 
                                    stroke-width="2.6" 
                                    stroke-linecap="round" 
                                    stroke-linejoin="round"
                                ></polyline>

                                <circle 
                                    :cx="getChartData(selectedTop5Person).lastX" 
                                    :cy="getChartData(selectedTop5Person).lastY" 
                                    r="12" 
                                    :fill="selectedTop5Person?.positive ? '#22c55e' : '#ef4444'" 
                                    fill-opacity="0.18"
                                ></circle>
                                <circle 
                                    :cx="getChartData(selectedTop5Person).lastX" 
                                    :cy="getChartData(selectedTop5Person).lastY" 
                                    r="4.5" 
                                    :fill="selectedTop5Person?.positive ? '#22c55e' : '#ef4444'"
                                ></circle>
                            </svg>
                        </div>
                    </div>

                    <div x-show="top5Tab === 'biography'">

                        <div class="flex justify-between border-b border-neutral-800 pb-3">
                            <span class="text-neutral-400" x-text="t('peakRank')"></span>
                            <span class="font-bold text-amber-400" x-text="'#' + (selectedTop5Person?.peakRank || selectedTop5Person?.id)"></span>
                        </div>
                        <div class="flex justify-between border-b border-neutral-800 pb-3">
                            <span class="text-neutral-400" x-text="t('peakNetWorth')"></span>
                            <span class="font-bold text-green-400" x-text="formatWorth(selectedTop5Person?.peakNetWorth || selectedTop5Person?.netWorthValue)"></span>
                        </div>
                        <div class="flex justify-between border-b border-neutral-800 pb-3">
                            <span class="text-neutral-400" x-text="t('sourceWealth')"></span>
                            <span class="font-medium" x-text="selectedTop5Person?.source"></span>
                        </div>
                        <div class="flex justify-between border-b border-neutral-800 pb-3">
                            <span class="text-neutral-400" x-text="t('gender')"></span>
                            <span class="font-medium" x-text="selectedTop5Person?.gender"></span>
                        </div>
                        <div class="flex justify-between border-b border-neutral-800 pb-3">
                            <span class="text-neutral-400" x-text="t('region')"></span>
                            <span class="font-medium" x-text="selectedTop5Person?.country"></span>

                </div>

        <!-- Encabezado del Leaderboard -->
        <div class="flex items-center justify-between mb-8">
            <h1 class="serif-font text-3xl font-normal" x-text="searchQuery !== '' ? t('searchResults') + ': ' + searchQuery : (selectedCategory ? t('category') + ': ' + selectedCategory : (currentFilter === 'women' ? t('womenTitle') : (currentFilter === 'companies' ? t('companiesTitle') : t('leaderboardTitle'))))"></h1>
            <template x-if="selectedCategory || searchQuery !== ''">
                <button @click="selectedCategory = null; searchQuery = ''; currentFilter = 'all'" class="text-sm bg-neutral-800 hover:bg-neutral-700 text-white px-4 py-2 rounded-lg transition" x-text="t('clearFilters')"></button>
            </template>
        </div>

        <div x-show="currentFilter === 'companies' && displayedPeople.length === 0" class="text-center py-16 card-bg rounded-2xl border border-neutral-800">
            <div class="text-4xl mb-3">🏢</div>
            <h3 class="serif-font text-xl font-bold text-white mb-2" x-text="t('noCompaniesTitle')"></h3>
            <p class="text-xs text-neutral-400 max-w-md mx-auto mb-6" x-text="t('noCompaniesDesc')"></p>
            <template x-if="currentUser">
                <button @click="openCompanyModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-xs font-semibold transition" x-text="t('createCompanyMenu')"></button>
            </template>
            <template x-if="!currentUser">
                <button @click="showRegisterModal = true" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-xs font-semibold transition" x-text="t('registerLogin')"></button>
            </template>
        </div>

        <!-- Cuadrícula Leaderboard -->
        <div x-show="currentFilter !== 'top5' || searchQuery !== ''" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
            <template x-for="(item, index) in displayedPeople" :key="item.id + '-' + (currentFilter === 'companies' ? 'comp' : 'pers')">
                <div @click="currentFilter === 'companies' ? openCompanyDashboard(item) : openProfile(item)" :class="getContainerGlowClass(item)" class="card-bg p-4 rounded-xl cursor-pointer hover:border hover:border-neutral-600 transition flex flex-col items-center text-center relative">
                    
                    <template x-if="isBloodActive(item)">
                        <span class="blood-badge absolute top-3 right-3 text-base" title="Perdiendo capital">🩸</span>
                    </template>
                    <template x-if="!isBloodActive(item) && hasFire(item)">
                        <span :class="getFireBadgeClass(item)" class="fire-badge absolute top-3 right-3 text-base" :title="getFireLabel(item)">🔥</span>
                    </template>

                    <img :src="item.img" class="w-32 h-32 rounded-lg object-cover mb-4 bg-black" alt="Avatar">
                    
                    <div class="flex items-center justify-center gap-1.5 flex-wrap">
                        <div class="serif-font text-lg font-bold" x-text="(currentFilter === 'women' || currentFilter === 'companies' || selectedCategory || searchQuery !== '' ? (index + 1) : item.id) + '. ' + item.name"></div>
                    </div>

                    <template x-if="isTrillionaire(item)">
                        <span class="trillionaire-badge text-[9px] px-2 py-0.5 rounded uppercase mt-1" x-text="'👑 ' + getTrillionaireLabel(item)"></span>
                    </template>
                    
                    <div class="text-xs text-neutral-400 mt-1" x-show="currentFilter === 'companies'" x-text="t('ceoLabel') + ': ' + item.ceo + ' (Lvl ' + (item.level || 1) + ')'"></div>

                    <div class="flex items-center justify-center gap-2 mt-1 flex-wrap">
                        <div class="text-neutral-300 text-sm font-semibold" x-text="formatWorth(item.netWorthValue)"></div>
                        <div x-show="hasDailyChange(item)" :class="item.positive ? 'text-green-400' : 'text-red-400'" class="text-xs font-semibold" x-text="formatDailyChange(item)"></div>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <!-- Vista Detallada de Perfil -->
    <main x-show="selectedPerson" class="flex-grow max-w-5xl mx-auto w-full" x-data="{ profileTab: 'wealth' }" style="display: none;">
        <button @click="selectedPerson = null" class="text-sm text-neutral-400 hover:text-white mb-6 flex items-center gap-1" x-text="t('backButton')"></button>
        
        <div :class="getContainerGlowClass(selectedPerson)" class="bg-[#121212] p-8 rounded-2xl border border-neutral-800/90 flex flex-col justify-between shadow-2xl">
            <div>
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-4">
                        <div class="relative">
                            <img :src="selectedPerson?.img" class="w-16 h-16 rounded-xl object-cover bg-black" alt="Avatar">
                            <template x-if="isBloodActive(selectedPerson)">
                                <span class="blood-badge absolute -top-2 -right-2 text-xl" title="Perdiendo capital">🩸</span>
                            </template>
                            <template x-if="!isBloodActive(selectedPerson) && hasFire(selectedPerson)">
                                <span :class="getFireBadgeClass(selectedPerson)" class="fire-badge absolute -top-2 -right-2 text-xl" :title="getFireLabel(selectedPerson)">🔥</span>
                            </template>
                        </div>
                        <div>
                            <div class="flex items-center gap-2.5 flex-wrap">
                                <h2 class="serif-font text-2xl md:text-3xl font-bold" x-text="selectedPerson?.id ? (selectedPerson.id + '. ' + selectedPerson?.name) : selectedPerson?.name"></h2>
                                <template x-if="isTrillionaire(selectedPerson)">
                                    <span class="trillionaire-badge text-[10px] px-2 py-0.5 rounded-md uppercase" x-text="'👑 ' + getTrillionaireLabel(selectedPerson)"></span>
                                </template>
                            </div>
                            <div x-show="isBloodActive(selectedPerson)" class="text-xs font-semibold tracking-wider uppercase mt-1 text-red-500" x-text="t('bloodMarketLabel')"></div>
                            <div x-show="!isBloodActive(selectedPerson) && hasFire(selectedPerson)" class="text-xs font-semibold tracking-wider uppercase mt-1 text-neutral-300" x-text="'🔥 ' + getFireLabel(selectedPerson)"></div>
                        </div>
                    </div>
                    <template x-if="currentUser && currentUser.name.toLowerCase() === selectedPerson?.name.toLowerCase()">
                        <button @click="openBioEditor(selectedPerson)" class="bg-neutral-800 hover:bg-neutral-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5" x-text="t('editBioBtn')"></button>
                    </template>
                </div>

                <!-- Pestañas Estilo Píldora -->
                <div class="inline-flex bg-[#1c1c1c] p-1 rounded-full mb-7 border border-neutral-800/80">
                    <button @click="profileTab = 'wealth'" :class="profileTab === 'wealth' ? 'bg-[#2c2c2c] text-white font-semibold shadow-sm' : 'text-neutral-400 hover:text-white'" class="px-5 py-1.5 rounded-full text-xs md:text-sm transition" x-text="t('wealthHistory')"></button>
                    <button @click="profileTab = 'biography'" :class="profileTab === 'biography' ? 'bg-[#2c2c2c] text-white font-semibold shadow-sm' : 'text-neutral-400 hover:text-white'" class="px-5 py-1.5 rounded-full text-xs md:text-sm transition" x-text="t('biography')"></button>
                    <button @click="profileTab = 'stats'" :class="profileTab === 'stats' ? 'bg-[#2c2c2c] text-white font-semibold shadow-sm' : 'text-neutral-400 hover:text-white'" class="px-5 py-1.5 rounded-full text-xs md:text-sm transition" x-text="t('stats')"></button>
                </div>

                <div x-show="profileTab === 'wealth'">
                    <div class="text-[11px] font-bold text-neutral-400 tracking-wider uppercase mb-1" x-text="t('currentNetWorth')"></div>
                    <div class="text-5xl font-bold tracking-tight text-white mb-2" x-text="formatWorth(selectedPerson?.netWorthValue)"></div>
                    
                    <div class="flex items-center gap-2 text-sm font-semibold mb-7">
                        <span :class="selectedPerson?.positive ? 'text-green-400' : 'text-red-500'" x-text="formatDailyChange(selectedPerson)"></span>
                        <span class="text-xs font-normal text-neutral-400 uppercase tracking-wide" x-text="t('lastCycleTag')"></span>
                    </div>

                    <div class="mb-2 flex items-center justify-between">
                        <div>
                            <div class="text-xs font-bold text-neutral-300 uppercase tracking-wider" x-text="t('wealthHistory')"></div>
                            <div class="text-xs text-neutral-500 mt-0.5" x-text="t('chartSubLabel')"></div>
                        </div>
                        <span :class="selectedPerson?.positive ? 'bg-green-500/10 text-green-400 border-green-500/30' : 'bg-red-500/10 text-red-400 border-red-500/30'" class="text-[11px] font-bold px-2.5 py-1 rounded-full border uppercase tracking-wider" x-text="selectedPerson?.positive ? '▲ ' + t('gaining') : '▼ ' + t('dropping')"></span>
                    </div>

                    <div class="relative mt-2 pt-2">
                        <svg viewBox="0 0 460 175" class="w-full h-44 overflow-visible">
                            <defs>
                                <radialGradient :id="'radial-glow-prof-' + (selectedPerson?.id || 999)" cx="65%" cy="55%" r="50%">
                                    <stop offset="0%" :stop-color="selectedPerson?.positive ? '#22c55e' : '#ef4444'" stop-opacity="0.22"/>
                                    <stop offset="100%" :stop-color="selectedPerson?.positive ? '#22c55e' : '#ef4444'" stop-opacity="0"/>
                                </radialGradient>
                            </defs>
                            <rect x="0" y="0" width="460" height="175" :fill="'url(#radial-glow-prof-' + (selectedPerson?.id || 999) + ')'" rx="12"></rect>
                            
                            <polyline 
                                :points="getChartData(selectedPerson).pointsStr" 
                                fill="none" 
                                :stroke="selectedPerson?.positive ? '#22c55e' : '#ef4444'" 
                                stroke-width="2.6" 
                                stroke-linecap="round" 
                                stroke-linejoin="round"
                            ></polyline>

                            <circle 
                                :cx="getChartData(selectedPerson).lastX" 
                                :cy="getChartData(selectedPerson).lastY" 
                                r="12" 
                                :fill="selectedPerson?.positive ? '#22c55e' : '#ef4444'" 
                                fill-opacity="0.18"
                            ></circle>
                            <circle 
                                :cx="getChartData(selectedPerson).lastX" 
                                :cy="getChartData(selectedPerson).lastY" 
                                r="4.5" 
                                :fill="selectedPerson?.positive ? '#22c55e' : '#ef4444'"
                            ></circle>
                        </svg>
                    </div>
                </div>

                <div x-show="profileTab === 'biography'">
                    <ul class="space-y-4 list-disc list-inside text-neutral-200 serif-font text-lg">
                        <template x-for="bullet in selectedPerson?.bio">
                            <li x-text="bullet"></li>
                        </template>
                    </ul>
                </div>

                <div x-show="profileTab === 'stats'" class="space-y-4 text-sm">
                    <div class="flex justify-between border-b border-neutral-800 pb-3">
                        <span class="text-neutral-400" x-text="t('peakRank')"></span>
                        <span class="font-bold text-amber-400" x-text="'#' + (selectedPerson?.peakRank || selectedPerson?.id || 1)"></span>
                    </div>
                    <div class="flex justify-between border-b border-neutral-800 pb-3">
                        <span class="text-neutral-400" x-text="t('peakNetWorth')"></span>
                        <span class="font-bold text-green-400" x-text="formatWorth(selectedPerson?.peakNetWorth || selectedPerson?.netWorthValue)"></span>
                    </div>
                    <div class="flex justify-between border-b border-neutral-800 pb-3">
                        <span class="text-neutral-400" x-text="t('sourceWealth')"></span>
                        <span class="font-medium" x-text="selectedPerson?.source"></span>
                    </div>
                    <div class="flex justify-between border-b border-neutral-800 pb-3">
                        <span class="text-neutral-400" x-text="t('gender')"></span>
                        <span class="font-medium" x-text="selectedPerson?.gender"></span>
                    </div>
                    <div class="flex justify-between border-b border-neutral-800 pb-3">
                        <span class="text-neutral-400" x-text="t('region')"></span>
                        <span class="font-medium" x-text="selectedPerson?.country"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Dashboard / Panel de Empresa Personalizado -->
    <main x-show="selectedCompanyView" class="flex-grow max-w-5xl mx-auto w-full" style="display: none;">
        <button @click="selectedCompanyView = null" class="text-sm text-neutral-400 hover:text-white mb-6 flex items-center gap-1" x-text="t('backButton')"></button>
        
        <div class="bg-[#121212] p-8 rounded-2xl border border-neutral-800/90 shadow-2xl space-y-6">
            <div class="flex flex-col md:flex-row items-center justify-between gap-6 border-b border-neutral-800 pb-6">
                <div class="flex items-center gap-5">
                    <img :src="selectedCompanyView?.img" class="w-20 h-20 rounded-2xl object-cover bg-black border border-neutral-800" alt="Company Logo">
                    <div>
                        <div class="flex items-center gap-3">
                            <h2 class="serif-font text-3xl font-bold text-white" x-text="selectedCompanyView?.name"></h2>
                            <span class="bg-blue-500/10 text-blue-400 border border-blue-500/30 text-xs px-2.5 py-1 rounded-full font-bold uppercase" x-text="'Lvl ' + (selectedCompanyView?.level || 1)"></span>
                        </div>
                        <div class="text-xs text-neutral-400 mt-1" x-text="t('ceoLabel') + ': ' + selectedCompanyView?.ceo"></div>
                    </div>
                </div>

                <template x-if="currentUser && (currentUser.name.toLowerCase() === selectedCompanyView?.ceo.toLowerCase() || (selectedCompanyView?.members && selectedCompanyView.members.includes(currentUser.name)))">
                    <div class="flex items-center gap-3">
                        <template x-if="currentUser.name.toLowerCase() === selectedCompanyView?.ceo.toLowerCase()">
                            <button @click="openEditCompanyModal(selectedCompanyView)" class="bg-neutral-800 hover:bg-neutral-700 text-white px-4 py-2 rounded-xl text-xs font-semibold transition" x-text="t('editCompanySettings')"></button>
                        </template>
                    </div>
                </template>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-black/40 border border-neutral-800 p-5 rounded-xl">
                    <div class="text-[11px] text-neutral-400 uppercase tracking-wider mb-1" x-text="t('currentValuation')"></div>
                    <div class="text-3xl font-bold text-white" x-text="formatWorth(selectedCompanyView?.netWorthValue)"></div>
                </div>
                <div class="bg-black/40 border border-neutral-800 p-5 rounded-xl">
                    <div class="text-[11px] text-neutral-400 uppercase tracking-wider mb-1" x-text="t('companyLevel')"></div>
                    <div class="text-3xl font-bold text-blue-400" x-text="'Level ' + (selectedCompanyView?.level || 1)"></div>
                </div>
                <div class="bg-black/40 border border-neutral-800 p-5 rounded-xl">
                    <div class="text-[11px] text-neutral-400 uppercase tracking-wider mb-1" x-text="t('teamMembersCount')"></div>
                    <div class="text-3xl font-bold text-green-400" x-text="(selectedCompanyView?.members?.length || 1) + ' Members'"></div>
                </div>
            </div>

            <!-- Biografía y Estadísticas de la Empresa (Visibles para CEO y Miembros) -->
            <div class="card-bg border border-neutral-800 p-6 rounded-2xl space-y-4">
                <h3 class="serif-font text-lg font-bold text-white" x-text="t('companyBioAndStatsTitle')"></h3>
                <p class="text-xs text-neutral-400" x-text="selectedCompanyView?.bio || t('defaultCompanyBio')"></p>
                <div class="grid grid-cols-2 gap-4 pt-2 text-xs text-neutral-300">
                    <div><span class="text-neutral-500" x-text="t('companyCreationCycle')"></span>: Cycle #<span x-text="selectedCompanyView?.id || 1"></span></div>
                    <div><span class="text-neutral-500" x-text="t('companyMarketPerformance')"></span>: <span :class="selectedCompanyView?.positive ? 'text-green-400' : 'text-red-400'" x-text="selectedCompanyView?.positive ? '▲ Gaining' : '▼ Dropping'"></span></div>
                </div>
            </div>

            <!-- Botones de Mejora (Upgrade / Invest) -->
            <template x-if="currentUser && currentUser.name.toLowerCase() === selectedCompanyView?.ceo.toLowerCase()">
                <div class="card-bg border border-neutral-800 p-6 rounded-2xl space-y-4">
                    <h3 class="serif-font text-lg font-bold text-white" x-text="t('upgradeCompanyTitle')"></h3>
                    <p class="text-xs text-neutral-400" x-text="t('upgradeCompanyDesc')"></p>
                    <div class="flex flex-wrap gap-4 pt-2">
                        <button @click="upgradeCompany()" class="bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-xl text-xs font-bold transition flex items-center gap-2">
                            🚀 <span x-text="t('upgradeButtonText') + ' ($5.0B Investment)'"></span>
                        </button>
                    </div>
                </div>
            </template>

            <!-- Sección de Invitaciones de Miembros Reales -->
            <div class="card-bg border border-neutral-800 p-6 rounded-2xl space-y-4">
                <h3 class="serif-font text-lg font-bold text-white" x-text="t('teamMembersTitle')"></h3>
                <div class="flex flex-wrap gap-2">
                    <template x-for="mem in (selectedCompanyView?.members || [selectedCompanyView?.ceo])">
                        <span class="bg-neutral-800 border border-neutral-700 text-neutral-200 px-3 py-1.5 rounded-lg text-xs font-medium" x-text="mem"></span>
                    </template>
                </div>

                <template x-if="currentUser && currentUser.name.toLowerCase() === selectedCompanyView?.ceo.toLowerCase()">
                    <div class="pt-4 border-t border-neutral-800 space-y-3">
                        <label class="block text-xs text-neutral-400 uppercase tracking-wider" x-text="t('inviteMemberLabel')"></label>
                        <div class="flex gap-3">
                            <select x-model="selectedUserToInvite" class="bg-black border border-neutral-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 flex-grow">
                                <option value="" disabled selected x-text="t('selectUserPlaceholder')"></option>
                                <template x-for="p in people.filter(p => !selectedCompanyView.members.includes(p.name))" :key="p.name">
                                    <option :value="p.name" x-text="p.name"></option>
                                </template>
                            </select>
                            <button @click="inviteUserToCompany()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-xs font-semibold transition whitespace-nowrap" x-text="t('inviteButtonText')"></button>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <!-- Modales -->
    <div x-show="showRegisterModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 px-4" style="display: none;">
        <div class="card-bg p-8 rounded-2xl border border-neutral-800 max-w-md w-full relative">
            <button @click="showRegisterModal = false" class="absolute top-4 right-4 text-neutral-400 hover:text-white text-xl">×</button>
            <h2 class="serif-font text-2xl font-bold mb-2 text-white" x-text="t('modalTitle')"></h2>
            <p class="text-xs text-neutral-400 mb-6" x-text="t('modalDesc')"></p>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('robloxUser')"></label>
                    <input type="text" x-model="regUsername" placeholder="e.g. Giacolamela" class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('password')"></label>
                    <input type="password" x-model="regPassword" placeholder="••••••••" class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <button @click="handleAuthUser()" :disabled="isRegistering" class="w-full bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition flex items-center justify-center">
                    <span x-show="!isRegistering" x-text="t('authButton')"></span>
                    <span x-show="isRegistering" x-text="t('verifying')"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Obligatorio de Creación de Empresa tras Iniciar Sesión por primera vez -->
    <div x-show="showFirstTimeCompanyModal" class="fixed inset-0 bg-black/90 flex items-center justify-center z-50 px-4" style="display: none;">
        <div class="card-bg p-8 rounded-2xl border border-blue-500/50 max-w-md w-full relative shadow-2xl">
            <h2 class="serif-font text-2xl font-bold mb-2 text-white" x-text="t('firstTimeCompanyTitle')"></h2>
            <p class="text-xs text-neutral-400 mb-6" x-text="t('firstTimeCompanyDesc')"></p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('companyNameLabel')"></label>
                    <input type="text" x-model="newCompanyName" placeholder="e.g. Apex Corp" class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('companyInvestmentLabel')"></label>
                    <input type="number" step="0.1" x-model.number="newCompanyInvestment" class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('companyLogoLabel')"></label>
                    <input type="text" x-model="newCompanyLogo" placeholder="https://..." class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 mb-2">
                    <label class="block text-[11px] text-blue-400 cursor-pointer hover:underline">
                        📁 <span x-text="t('uploadFromFile')"></span>
                        <input type="file" accept="image/*" @change="handleLogoFileUpload($event)" class="hidden">
                    </label>
                </div>
                <button @click="createCompanyFromModal(true)" class="w-full bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition" x-text="t('launchEmpireButton')"></button>
            </div>
        </div>
    </div>

    <div x-show="showBioModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 px-4" style="display: none;">
        <div class="card-bg p-8 rounded-2xl border border-neutral-800 max-w-lg w-full relative">
            <button @click="showBioModal = false" class="absolute top-4 right-4 text-neutral-400 hover:text-white text-xl">×</button>
            <h2 class="serif-font text-2xl font-bold mb-2 text-white" x-text="t('editBioTitle')"></h2>
            <p class="text-xs text-neutral-400 mb-4" x-text="t('editBioDesc')"></p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('sourceWealth')"></label>
                    <select x-model="tempSource" class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                        <template x-for="cat in allSectors" :key="cat">
                            <option :value="cat" x-text="cat"></option>
                        </template>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('biography')"></label>
                    <textarea x-model="tempBioText" rows="4" class="w-full bg-black border border-neutral-700 rounded-lg p-3 text-sm text-white focus:outline-none focus:border-blue-500" placeholder="Escribe tu biografía..."></textarea>
                </div>

                <button @click="saveUserBio()" class="w-full bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition" x-text="t('saveBioButton')"></button>
            </div>
        </div>
    </div>

    <div x-show="showCompanyModal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 px-4" style="display: none;">
        <div class="card-bg p-8 rounded-2xl border border-neutral-800 max-w-md w-full relative">
            <button @click="showCompanyModal = false" class="absolute top-4 right-4 text-neutral-400 hover:text-white text-xl">×</button>
            <h2 class="serif-font text-2xl font-bold mb-2 text-white" x-text="t('createCompanyTitle')"></h2>
            <p class="text-xs text-neutral-400 mb-6" x-text="t('createCompanyDesc')"></p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('companyNameLabel')"></label>
                    <input type="text" x-model="newCompanyName" placeholder="e.g. Nexus Corp" class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('companyInvestmentLabel')"></label>
                    <input type="number" step="0.1" x-model.number="newCompanyInvestment" placeholder="e.g. 15.0 (Billions)" class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs text-neutral-400 uppercase tracking-wider mb-1" x-text="t('companyLogoLabel')"></label>
                    <input type="text" x-model="newCompanyLogo" placeholder="https://..." class="w-full bg-black border border-neutral-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 mb-2">
                    <label class="block text-[11px] text-blue-400 cursor-pointer hover:underline">
                        📁 <span x-text="t('uploadFromFile')"></span>
                        <input type="file" accept="image/*" @change="handleLogoFileUpload($event)" class="hidden">
                    </label>
                    <div class="flex items-center gap-2 mt-2">
                        <template x-for="(preset, pIdx) in presetCompanyLogos" :key="pIdx">
                            <img :src="preset" @click="newCompanyLogo = preset" :class="newCompanyLogo === preset ? 'ring-2 ring-blue-500' : 'opacity-70 hover:opacity-100'" class="w-9 h-9 rounded-lg cursor-pointer bg-black object-cover transition" title="Select emblem">
                        </template>
                    </div>
                </div>
                <button @click="createCompanyFromModal(false)" class="w-full bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition" x-text="t('okayButton')"></button>
            </div>
        </div>
    </div>

            <p class="text-xs text-neutral-400 mb-6" x-text="t('editCompanyDesc')"></p>

                <div>

        function deterministicRandom(seedStr) {
            let h = 2166136261 >>> 0;
            for (let i = 0; i < seedStr.length; i++) {
                h ^= seedStr.charCodeAt(i);
                h = Math.imul(h, 16777619);
            }
            h += h << 13;
            h ^= h >>> 7;
            h += h << 3;
            h ^= h >>> 17;
            h += h << 5;
            return (h >>> 0) / 4294967296;
        }

                formatWorth(val) {
                    if (val === undefined || val === null) return '$0B';
                    if (val >= 1000) {
                        let trillions = val / 1000;
                        return '$' + trillions.toFixed(1) + 'T';
                    }
                    return val % 1 === 0 ? '$' + val.toFixed(0) + 'B' : '$' + val.toFixed(1) + 'B';
                },

                    return item && item.netWorthValue >= 1000;

                    if (!this.isTrillionaire(item)) return '';
                    if (this.firstTrillionaireName && item.name.toLowerCase() === this.firstTrillionaireName.toLowerCase()) {

                    return item && item.changeVal !== undefined && item.changeVal !== 0;
                },
                formatDailyChange(item) {
                    if (!this.hasDailyChange(item)) return '▲ +$0B (0.0%)';
                    let prevWorth = item.netWorthValue - item.changeVal;
                    let percentage = prevWorth > 0 ? (item.changeVal / prevWorth) * 100 : 0;
                    let sign = item.changeVal > 0 ? '+' : '-';
                    let absChange = Math.abs(item.changeVal);
                    let valStr = '';
                    if (absChange >= 1000) {
                        valStr = `$${(absChange / 1000).toFixed(1)}T`;
                    } else if (absChange >= 1) {

                    } else {

                    }
                    let symbol = item.changeVal > 0 ? '▲' : '▼';

                        let step = (r - 0.5) * (first * 0.04);
                        vals.unshift(Math.max(5, Number((first - step).toFixed(2))));
