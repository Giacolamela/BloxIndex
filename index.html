                    this.showBioModal = true;
                },
                openCompanyModal() {
                    if (!this.currentUser) return;
                    this.newCompanyName = '';
                    this.newCompanySector = 'Technology & AI';
                    this.newCompanyInvestment = 15.0;
                    this.newCompanyLogo = OMEGA_LOGO_SVG;
                    this.showCompanyModal = true;
                },
                handleLogoFileUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.newCompanyLogo = e.target.result;
                    };
                    reader.readAsDataURL(file);
                },
                handleEditLogoFileUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.editCompanyLogoInput = e.target.result;
                    };
                    reader.readAsDataURL(file);
                },
                createCompanyFromModal(isFirstTime) {
                    if (!this.newCompanyName || !this.newCompanyName.trim()) {
                        alert('Please enter a company name.');
                        return;
                    }
                    let compName = this.newCompanyName.trim();
                    if (BANNED_COMPANIES.includes(compName.toLowerCase())) {
                        alert('That company name is not allowed.');
                        return;
                    }
                    let investment = Number((parseFloat(this.newCompanyInvestment) || 15.0).toFixed(1));
                    let logoUrl = this.newCompanyLogo.trim() || OMEGA_LOGO_SVG;

                    let newCompanyEntry = {
                        id: this.companies.length + 1,
                        name: compName,
                        netWorthValue: investment,
                        changeVal: 2.0,
                        positive: true,
                        history: [investment - 2.0, investment],
                        img: logoUrl,
                        ceo: this.currentUser.name,
                        level: 1,
                        members: [this.currentUser.name],
                        bio: `Company founded by CEO ${this.currentUser.name}. Scaling successfully in global markets.`
                    };

                    this.companies.push(newCompanyEntry);
                    this.companies.sort((a, b) => b.netWorthValue - a.netWorthValue);

                    try {
                        localStorage.setItem('empire_user_companies', JSON.stringify(this.companies));
                    } catch (e) {
                        console.error('Error saving company', e);
                    }

                    this.showCompanyModal = false;
                    this.showFirstTimeCompanyModal = false;
                    alert(`Company "${compName}" successfully launched!`);
                },
                upgradeCompany() {
                    if (!this.selectedCompanyView) return;
                    let comp = this.selectedCompanyView;
                    comp.level = (comp.level || 1) + 1;
                    comp.netWorthValue = Number((comp.netWorthValue + 12.5).toFixed(1));
                    comp.changeVal = Number((comp.changeVal + 3.0).toFixed(1));
                    comp.positive = true;
                    if (!comp.history) comp.history = [];
                    comp.history.push(comp.netWorthValue);

                    try {
                        localStorage.setItem('empire_user_companies', JSON.stringify(this.companies));
                    } catch(e) {}
                    alert(`Company upgraded to Level ${comp.level}! Valuation increased.`);
                },
                inviteUserToCompany() {
                    if (!this.selectedCompanyView || !this.selectedUserToInvite) return;
                    if (!this.selectedCompanyView.members) {
                        this.selectedCompanyView.members = [this.selectedCompanyView.ceo];
                    }
                    if (!this.selectedCompanyView.members.includes(this.selectedUserToInvite)) {
                        this.selectedCompanyView.members.push(this.selectedUserToInvite);
                        try {
                            localStorage.setItem('empire_user_companies', JSON.stringify(this.companies));
                        } catch(e) {}
                        alert(`${this.selectedUserToInvite} has been successfully invited and joined the company team!`);
                    }
                    this.selectedUserToInvite = '';
                },
                saveUserBio() {
                    if (!this.currentUser) return;
                    let lines = this.tempBioText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                    if (lines.length === 0) lines = ["No biography provided yet."];
                    
                    this.currentUser.bio = lines;
                    this.currentUser.source = this.tempSource;
                    
                    let found = this.people.find(p => p.name.toLowerCase() === this.currentUser.name.toLowerCase());
                    if (found) {
                        found.bio = lines;
                        found.source = this.tempSource;
                    }
                    
                    try {
                        localStorage.setItem('empire_current_user', JSON.stringify(this.currentUser));
                    } catch (e) {
                        console.error('Error saving profile changes', e);
                    }
                    
                    this.showBioModal = false;
                    alert('Profile and role updated successfully!');
                },
                logoutUser() {
                    this.currentUser = null;
                    localStorage.removeItem('empire_current_user');
                    alert(this.t('alertLogout'));
                },
                syncGlobalMarketToCycle(targetCycle) {
                    let syncedPeople = getBasePeople();
                    let syncedCompanies = getBaseCompanies();
                    let detectedFirstTrillionaire = this.firstTrillionaireName;

                    try {
                        let savedComps = localStorage.getItem('empire_user_companies');
                        if (savedComps) {
                            let parsedComps = JSON.parse(savedComps);
                            if (Array.isArray(parsedComps)) {
                                parsedComps.forEach(c => {
                                    if (!syncedCompanies.some(baseC => baseC.name.toLowerCase() === c.name.toLowerCase())) {
                                        syncedCompanies.push(c);
                                    }
                                });
                            }
                        }
                    } catch (e) {}

                    syncedPeople.forEach(p => {
                        p.history = [p.netWorthValue];
                    });
                    syncedCompanies.forEach(c => {
                        if (!c.members) c.members = [c.ceo];
                        if (!c.level) c.level = 1;
                        c.history = [c.netWorthValue];
                    });

                    const startCycle = Math.max(1, targetCycle - 32);

                    for (let cycle = startCycle; cycle <= targetCycle; cycle++) {
                        syncedCompanies.forEach(company => {
                            let r1 = deterministicRandom(`comp_${company.name.toLowerCase()}_c${cycle}_a`);
                            let r2 = deterministicRandom(`comp_${company.name.toLowerCase()}_c${cycle}_b`);
                            let pctChange = 0;

                            if (r1 < 0.25) {
                                pctChange = 0;
                            } else if (r1 < 0.70) {
                                pctChange = 0.005 + r2 * 0.045;
                            } else {
                                pctChange = -(0.005 + r2 * 0.035);
                            }

                            let companyDelta = Number((company.netWorthValue * pctChange).toFixed(1));
                            if (Math.abs(companyDelta) < 0.1) companyDelta = 0;

                            company.netWorthValue = Math.max(5.0, Number((company.netWorthValue + companyDelta).toFixed(1)));
                            company.changeVal = companyDelta;
                            company.positive = companyDelta >= 0;
                            company.history.push(company.netWorthValue);
                        });

                        syncedPeople.forEach(person => {
                            let r1 = deterministicRandom(`pers_${person.name.toLowerCase()}_c${cycle}_a`);
                            let r2 = deterministicRandom(`pers_${person.name.toLowerCase()}_c${cycle}_b`);
                            let pctChange = 0;

                            if (r1 < 0.20) {
                                pctChange = 0;
                            } else if (r1 < 0.56) {
                                pctChange = 0.003 + r2 * 0.038;
                            } else if (r1 < 0.70) {
                                pctChange = 0.025 + r2 * 0.065;
                            } else {
                                pctChange = -(0.005 + r2 * 0.048);
                            }

                            let delta = Number((person.netWorthValue * pctChange).toFixed(1));
                            if (Math.abs(delta) < 0.1) delta = 0;

                            person.netWorthValue = Math.max(10.0, Number((person.netWorthValue + delta).toFixed(1)));
                            person.changeVal = delta;
                            person.positive = delta >= 0;
                            person.history.push(person.netWorthValue);

                            if (!person.peakNetWorth || person.netWorthValue > person.peakNetWorth) {
                                person.peakNetWorth = Number(person.netWorthValue.toFixed(1));
                            }

                            if (!detectedFirstTrillionaire && person.netWorthValue >= 1000) {
                                detectedFirstTrillionaire = person.name;
                            }
                        });

                        syncedPeople.sort((a, b) => b.netWorthValue - a.netWorthValue);
                        syncedPeople.forEach((p, idx) => {
                            p.id = idx + 1;
                            if (!p.peakRank || p.id < p.peakRank) {
                                p.peakRank = p.id;
                            }
                        });
                    }

                    if (!detectedFirstTrillionaire) {
                        let topCandidate = syncedPeople.find(p => p.netWorthValue >= 1000);
                        if (topCandidate) detectedFirstTrillionaire = topCandidate.name;
                    }

                    if (this.currentUser) {
                        let match = syncedPeople.find(p => p.name.toLowerCase() === this.currentUser.name.toLowerCase());
                        if (match) {
                            match.bio = this.currentUser.bio;
                            match.source = this.currentUser.source;
                            match.img = this.currentUser.img;
                            this.currentUser = match;
                        } else {
                            if (!this.currentUser.history || this.currentUser.history.length === 0) {
                                this.currentUser.history = [this.currentUser.netWorthValue];
                            }
                            syncedPeople.push(this.currentUser);
                            syncedPeople.sort((a, b) => b.netWorthValue - a.netWorthValue);
                            syncedPeople.forEach((p, idx) => p.id = idx + 1);
                        }
                    }

                    syncedCompanies.sort((a, b) => b.netWorthValue - a.netWorthValue);

                    this.firstTrillionaireName = detectedFirstTrillionaire;
                    this.people = syncedPeople;
                    this.companies = syncedCompanies;
                    this.lastSimulatedCycle = targetCycle;

                    if (this.selectedTop5Person) {
                        let updatedTop = this.people.find(p => p.name === this.selectedTop5Person.name);
                        this.selectedTop5Person = updatedTop || this.people[0];
                    } else if (this.people.length > 0) {
                        this.selectedTop5Person = this.people[0];
                    }

                    if (this.selectedPerson) {
                        let updatedSel = this.people.find(p => p.name === this.selectedPerson.name);
                        if (updatedSel) this.selectedPerson = updatedSel;
                    }

                    if (this.selectedCompanyView) {
                        let updatedComp = this.companies.find(c => c.name === this.selectedCompanyView.name);
                        if (updatedComp) this.selectedCompanyView = updatedComp;
                    }
                },
                getCurrentGlobalCycle() {
                    const elapsed = Math.max(0, Date.now() - GLOBAL_EPOCH_MS);
                    return Math.floor(elapsed / TWELVE_HOURS_MS);
                },
                startCountdownLoop() {
                    if (this.timerInterval) clearInterval(this.timerInterval);
                    this.timerInterval = setInterval(() => {
                        let now = Date.now();
                        let currentCycle = this.getCurrentGlobalCycle();
                        let nextCycleStart = GLOBAL_EPOCH_MS + (currentCycle + 1) * TWELVE_HOURS_MS;
                        
                        this.nextUpdateTimestamp = nextCycleStart;
                        this.timeRemainingMs = Math.max(0, nextCycleStart - now);

                        if (currentCycle > this.lastSimulatedCycle) {
                            this.syncGlobalMarketToCycle(currentCycle);
                        }
                    }, 1000);
                },
                async refreshRobloxProfile(userObj) {
                    try {
                        let userRes = await fetch(`https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(userObj.name)}&limit=5`);
                        let userData = await userRes.json();
                        if (userData.data && userData.data.length > 0) {
                            let matchedUser = userData.data.find(u => u.name.toLowerCase() === userObj.name.toLowerCase()) || userData.data[0];
                            let userId = matchedUser.id;
                            let thumbRes = await fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=false`);
                            let thumbData = await thumbRes.json();
                            if (thumbData.data && thumbData.data.length > 0 && thumbData.data[0].imageUrl) {
                                userObj.img = thumbData.data[0].imageUrl;
                                userObj.name = matchedUser.name;
                            }
                        }
                    } catch (e) {
                        console.log('No se pudo actualizar el perfil de Roblox automáticamente:', e);
                    }
                },
                async handleAuthUser() {
                    if (!this.regUsername || !this.regUsername.trim()) {
                        alert(this.t('alertErrorUser'));
                        return;
                    }
                    
                    let cleanUsername = this.regUsername.trim();
                    let lowerUsername = cleanUsername.toLowerCase();

                    this.isRegistering = true;

                    let existingPerson = this.people.find(p => p.name.toLowerCase() === lowerUsername);
                    
                    if (existingPerson) {
                        await this.refreshRobloxProfile(existingPerson);
                        this.currentUser = existingPerson;
                        localStorage.setItem('empire_current_user', JSON.stringify(this.currentUser));
                        this.isRegistering = false;
                        this.showRegisterModal = false;
                        this.regUsername = '';
                        this.regPassword = '';
                        alert(`${this.t('alertLogin')} ${existingPerson.name}!`);

                        let userComp = this.getUserCompany();
                        if (!userComp) {
                            this.newCompanyName = `${cleanUsername} Corp`;
                            this.newCompanyInvestment = 15.0;
                            this.newCompanyLogo = OMEGA_LOGO_SVG;
                            this.showFirstTimeCompanyModal = true;
                        }
                        return;
                    }

                    let avatarUrl = 'https://tr.rbxcdn.com/30DAY-AvatarHeadshot-184545E355293CB292186A212E3D9B96-Png-Background/150/150/AvatarHeadshot/Webp/noFilter';
                    
                    try {
                        let userRes = await fetch(`https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(cleanUsername)}&limit=10`);
                        let userData = await userRes.json();
                        if (userData.data && userData.data.length > 0) {
                            let matchedUser = userData.data.find(u => u.name.toLowerCase() === lowerUsername) || userData.data[0];
                            let userId = matchedUser.id;
                            let thumbRes = await fetch(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=false`);
                            let thumbData = await thumbRes.json();
                            if (thumbData.data && thumbData.data.length > 0 && thumbData.data[0].imageUrl) {
                                avatarUrl = thumbData.data[0].imageUrl;
                                cleanUsername = matchedUser.name;
                            }
                        }
                    } catch (e) {
                        console.log('Error conectando con Roblox API:', e);
                    }

                    let targetUser = {
                        id: this.people.length + 1,
                        name: cleanUsername,
                        netWorthValue: 100.0,
                        peakNetWorth: 100.0,
                        peakRank: this.people.length + 1,
                        changeVal: 1.5,
                        positive: true,
                        history: [98.5, 100.0],
                        img: avatarUrl,
                        bio: [`${cleanUsername} successfully registered into BloxIndex.`],
                        country: 'Global',
                        source: 'Tycoons',
                        gender: 'Man'
                    };

                    this.people.push(targetUser);
                    this.people.sort((a, b) => b.netWorthValue - a.netWorthValue);
                    this.people.forEach((p, idx) => {
                        p.id = idx + 1;
                        if (!p.peakRank || p.id < p.peakRank) p.peakRank = p.id;
                        if (!p.peakNetWorth || p.netWorthValue > p.peakNetWorth) p.peakNetWorth = Number(p.netWorthValue.toFixed(1));
                    });
                    
                    if (!this.firstTrillionaireName && targetUser.netWorthValue >= 1000) {
                        this.firstTrillionaireName = targetUser.name;
                    }

                    this.currentUser = targetUser;
                    
                    try {
                        localStorage.setItem('empire_current_user', JSON.stringify(this.currentUser));
                    } catch (err) {
                        console.error('Error guardando en localStorage', err);
                    }
                    
                    this.isRegistering = false;
                    this.showRegisterModal = false;
                    this.regUsername = '';
                    this.regPassword = '';
                    alert(`${this.t('alertRegister')} ${cleanUsername}.`);

                    this.newCompanyName = `${cleanUsername} Corp`;
                    this.newCompanyInvestment = 15.0;
                    this.newCompanyLogo = OMEGA_LOGO_SVG;
                    this.showFirstTimeCompanyModal = true;
                },
                async initEmpire() {
                    let savedLang = localStorage.getItem('empire_lang');
                    if (savedLang && translations[savedLang]) {
                        this.lang = savedLang;
                    }

                    try {
                        let savedUser = localStorage.getItem('empire_current_user');
                        if (savedUser) {
                            this.currentUser = JSON.parse(savedUser);
                            await this.refreshRobloxProfile(this.currentUser);
                            localStorage.setItem('empire_current_user', JSON.stringify(this.currentUser));
                        }
                    } catch(e) {
                        localStorage.removeItem('empire_current_user');
                    }

                    let currentCycle = this.getCurrentGlobalCycle();
                    let nextCycleStart = GLOBAL_EPOCH_MS + (currentCycle + 1) * TWELVE_HOURS_MS;
                    this.nextUpdateTimestamp = nextCycleStart;
                    this.timeRemainingMs = Math.max(0, nextCycleStart - Date.now());

                    this.syncGlobalMarketToCycle(currentCycle);
                    this.startCountdownLoop();
                }
            }
        }
    </script>
